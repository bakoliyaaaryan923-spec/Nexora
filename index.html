<head>

<title>Nexora AI — Free Local</title><style>

.topbar{

  margin-bottom:12px;
  background:linear-gradient(90deg,#fff,#aaa0ff);

.hero p{
  color:#9299a7;
}

  display:flex;
  flex-direction:column;
  gap:16px;
}

  color:#8c93a0;
  padding:28px 10px;
}

.welcome strong{
  display:block;
  color:white;
  font-size:20px;
  margin-bottom:8px;
}

.message{
  max-width:84%;
  padding:14px 16px;
  border-radius:16px;
  line-height:1.6;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.user{
  margin-left:auto;
  background:#6256d8;
  border-bottom-right-radius:5px;
}

.assistant{
  margin-right:auto;
  background:#171a22;
  border:1px solid #292e38;
  border-bottom-left-radius:5px;
}

.tools{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
  margin-top:25px;
}

.tool{
  padding:13px 8px;
  border-radius:12px;
  border:1px solid #292e38;
  background:#14171e;
  color:#e9ebf0;
  cursor:pointer;
}

.tool:hover{
  background:#1c2029;
  border-color:#675cdc;
}

.tool small{
  display:block;
  color:#7d8492;
  margin-top:4px;
}

.composer-wrap{
  position:fixed;
  left:250px;
  right:0;
  bottom:0;
  padding:14px 20px 18px;
  background:linear-gradient(transparent,#090b10 25%);
}

.composer{
  width:min(900px,94%);
  margin:auto;
  display:flex;
  align-items:flex-end;
  gap:8px;
  padding:9px;
  background:#151820;
  border:1px solid #303541;
  border-radius:17px;
  box-shadow:0 12px 40px rgba(0,0,0,.35);
}

textarea{
  flex:1;
  min-height:46px;
  max-height:150px;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:white;
  padding:12px;
}

  color:#707785;
}

.clear{
  border:0;
  background:transparent;
  color:#858c99;
  cursor:pointer;
  padding:11px;
}

.clear:hover{
  color:white;
}

.send{
  width:47px;
  height:46px;
  border:0;
  border-radius:12px;
  background:#6b5fe5;
  color:white;
  cursor:pointer;
  font-size:18px;
}

.send:hover{
  background:#796df0;
}

.notice{
  text-align:center;
  color:#555c68;
  font-size:10px;
  margin-top:7px;
}

@media(max-width:760px){
  .sidebar{
    display:none;
  }

  .composer-wrap{
    left:0;
  }

  .content{
    padding-top:35px;
  }

  .tools{
    grid-template-columns:repeat(2,1fr);
  }

  .message{
    max-width:93%;
  }

</style></head><body><div class="app"><aside class="sidebar">  <div class="logo">NEXORA <span>AI</span></div>  <button class="new-chat" onclick="newChat()">
    ＋ New chat
  </button>  <div class="history-title">History</div>  <div id="history" class="history"></div>  <div class="sidebar-bottom">
    FREE LOCAL MODE<br>
    No API required
  </div></aside><main class="main"><header class="topbar">
  <div class="brand">Nexora AI</div>
  <div class="status">● Local Ready</div>
</header><section class="content">  <div class="hero">
    <h1>Ask anything.</h1>
    <p>Useful AI-style tools that work directly in your browser.</p>
  </div>  <div id="chat" class="chat"><div id="welcome" class="welcome">
  <strong>Welcome to Nexora AI</strong>
  Ask a question or choose a tool below.
</div>

  </div>  <div class="tools"><button class="tool" onclick="chooseTool('ask')">
  🧠 Ask
  <small>Ask a question</small>
</button>

<button class="tool" onclick="chooseTool('learn')">
  📚 Learn
  <small>Explain a topic</small>
</button>

<button class="tool" onclick="chooseTool('write')">
  ✍️ Write
  <small>Writing helper</small>
</button>

<button class="tool" onclick="chooseTool('solve')">
  🧮 Solve
  <small>Calculator</small>
</button>

  </div></section></main>
</div><div class="composer-wrap">  <div class="composer"><textarea
  id="question"
  placeholder="Ask Nexora anything..."
  rows="1"
  onkeydown="handleKey(event)"
></textarea>

<button class="clear" onclick="clearChat()">
  Clear
</button>

<button class="send" onclick="sendMessage()">
  ➤
</button>

  </div>  <div class="notice">
    © 2026 Nexora AI · Free Local Mode
  </div></div><script>

const chat=document.getElementById("chat");
const box=document.getElementById("question");
const historyBox=document.getElementById("history");

function addMessage(text,type){

  const welcome=document.getElementById("welcome");

  if(welcome){
    welcome.remove();
  }

  const div=document.createElement("div");

  div.className="message "+type;
  div.textContent=text;

  chat.appendChild(div);

  window.scrollTo({
    top:document.body.scrollHeight,
    behavior:"smooth"
  });

  return div;
}

function addHistory(text){

  const item=document.createElement("button");

  item.className="history-item";
  item.textContent=text;

  item.onclick=function(){
    box.value=text;
    box.focus();
  };

  historyBox.prepend(item);
}

function newChat(){

  chat.innerHTML=`
    <div id="welcome" class="welcome">
      <strong>Welcome to Nexora AI</strong>
      Ask a question or choose a tool below.
    </div>
  `;

  box.value="";
  box.focus();
}

function clearChat(){
  newChat();
}

function handleKey(event){

  if(event.key==="Enter" && !event.shiftKey){
    event.preventDefault();
    sendMessage();
  }
}

function chooseTool(type){

  const prompts={
    ask:"",
    learn:"Explain this topic in simple language: ",
    write:"Help me write: ",
    solve:"Calculate: "
  };

  box.value=prompts[type] ?? "";
  box.focus();
}

function calculate(expression){

  let value=expression
    .replace(/×/g,"*")
    .replace(/÷/g,"/")
    .replace(/\s/g,"");

  if(!/^[0-9+\-*/().%]+$/.test(value)){
    return null;
  }

  try{

    const result=Function(
      '"use strict";return ('+value+')'
    )();

    if(
      typeof result==="number" &&
      Number.isFinite(result)
    ){
      return result;
    }

  }catch(error){}

  return null;
}

function localKnowledge(question){

  const q=question.toLowerCase().trim();

  const result=calculate(question);

  if(result!==null){
    return "🧮 Answer: "+result;
  }

  if(
    q==="hi" ||
    q==="hello" ||
    q==="hey" ||
    q==="नमस्ते"
  ){
    return "नमस्ते! मैं Nexora AI हूँ। अपना सवाल पूछिए।";
  }

  if(
    q.includes("bharat ki rajdhani") ||
    q.includes("india ki capital") ||
    q.includes("capital of india") ||
    q.includes("भारत की राजधानी")
  ){
    return `भारत की राजधानी नई दिल्ली (New Delhi) है।

3 महत्वपूर्ण बातें:
1. नई दिल्ली भारत की राष्ट्रीय राजधानी है।
2. यहाँ भारत की संसद स्थित है।
3. राष्ट्रपति भवन और कई केंद्रीय सरकारी कार्यालय यहाँ स्थित हैं।`;
  }

  if(
    q.includes("rajasthan ki rajdhani") ||
    q.includes("rajasthan capital") ||
    q.includes("राजस्थान की राजधानी")
  ){
    return `राजस्थान की राजधानी जयपुर (Jaipur) है।

जयपुर को "Pink City" के नाम से भी जाना जाता है।`;
  }

  if(
    q.includes("ai kya hai") ||
    q.includes("what is ai") ||
    q.includes("artificial intelligence") ||
    q.includes("एआई क्या है")
  ){
    return `AI यानी Artificial Intelligence ऐसी technology है जिसमें computer systems ऐसे काम कर सकते हैं जिनमें सामान्यतः human intelligence की जरूरत होती है।

उदाहरण:
• भाषा समझना
• सवालों के जवाब देना
• images पहचानना
• patterns ढूँढना
• predictions करना`;
  }

  if(
    q.includes("computer kya hai") ||
    q.includes("what is computer") ||
    q.includes("कंप्यूटर क्या है")
  ){
    return `कंप्यूटर एक electronic device है जो data को process करके उपयोगी information देता है।

इसके मुख्य काम हैं:
1. Input लेना
2. Data process करना
3. Output देना
4. Data store करना`;
  }

  if(
    q.includes("water formula") ||
    q.includes("pani ka formula") ||
    q.includes("पानी का सूत्र")
  ){
    return "पानी का रासायनिक सूत्र H₂O है। इसमें दो hydrogen atoms और एक oxygen atom होते हैं।";
  }

  if(
    q.includes("solar system") ||
    q.includes("saur mandal") ||
    q.includes("सौर मंडल")
  ){
    return `सौर मंडल सूर्य और उसके चारों ओर घूमने वाले ग्रहों तथा अन्य खगोलीय objects का समूह है।

सौर मंडल में 8 ग्रह हैं:
Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus और Neptune।`;
  }

  if(
    q.includes("earth") ||
    q.includes("prithvi") ||
    q.includes("पृथ्वी")
  ){
    return `पृथ्वी सूर्य से तीसरा ग्रह है।

पृथ्वी पर liquid water और जीवन के लिए उपयुक्त वातावरण मौजूद है। इसका एक प्राकृतिक उपग्रह है — चंद्रमा।`;
  }

  if(
    q.includes("sun") ||
    q.includes("surya") ||
    q.includes("सूर्य")
  ){
    return `सूर्य हमारे सौर मंडल का तारा है और पृथ्वी के लिए प्रकाश तथा ऊर्जा का मुख्य स्रोत है।`;
  }

  if(
    q.includes("rajasthan") ||
    q.includes("राजस्थान")
  ){
    return `राजस्थान भारत के उत्तर-पश्चिमी भाग में स्थित राज्य है।

राजधानी: जयपुर
प्रसिद्ध क्षेत्र: थार मरुस्थल
प्रसिद्ध शहर: जयपुर, जोधपुर, उदयपुर और जैसलमेर`;
  }

  if(
    q.includes("india") ||
    q.includes("bharat") ||
    q.includes("भारत")
  ){
    return `भारत दक्षिण एशिया का एक विशाल देश है।

राजधानी: नई दिल्ली
मुद्रा: भारतीय रुपया (₹)
क्षेत्र: दक्षिण एशिया

भारत अपनी विविध भाषाओं, संस्कृतियों और इतिहास के लिए प्रसिद्ध है।`;
  }

  return `मैं अभी Free Local Mode में चल रहा हूँ।

इस version में API की जरूरत नहीं है।

आप ये सवाल पूछ सकते हैं:
• भारत की राजधानी क्या है?
• राजस्थान की राजधानी क्या है?
• AI क्या है?
• कंप्यूटर क्या है?
• पानी का formula क्या है?
• सौर मंडल क्या है?
• 25 × 12

बाद में AI provider जोड़कर सामान्य सवालों के लिए real AI answers भी जोड़े जा सकते हैं।`;
}

function sendMessage(){

  const question=box.value.trim();

  if(!question){
    return;
  }

  addMessage(question,"user");
  addHistory(question);

  box.value="";

  const answer=localKnowledge(question);

  setTimeout(function(){
    addMessage(answer,"assistant");
  },220);
}

</script></body>
</html>
