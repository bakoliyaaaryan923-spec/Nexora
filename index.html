<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nexora AI</title>
  <meta
    name="description"
    content="Nexora AI — ask questions, write, solve and create from one workspace."
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background:
        radial-gradient(circle at top, #10233b 0%, #070b14 42%);
      color: #fff;
      min-height: 100vh;
    }

    header {
      height: 70px;
      padding: 0 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #202838;
      background: rgba(7, 11, 20, 0.92);
    }

    .logo {
      color: #6ee7ff;
      font-size: 23px;
      font-weight: 800;
    }

    .badge {
      background: #11182b;
      color: #9defff;
      border: 1px solid #27344b;
      padding: 7px 11px;
      border-radius: 20px;
      font-size: 12px;
    }

    .hero {
      text-align: center;
      padding: 65px 20px 30px;
    }

    .hero h1 {
      font-size: clamp(36px, 7vw, 60px);
      margin-bottom: 16px;
    }

    .hero h1 span {
      color: #6ee7ff;
    }

    .hero p {
      color: #9ca8bc;
      max-width: 650px;
      margin: auto;
      line-height: 1.6;
    }

    .workspace {
      width: min(900px, calc(100% - 28px));
      margin: 25px auto;
    }

    .chat-panel {
      background: #0e1524;
      border: 1px solid #27344b;
      border-radius: 22px;
      padding: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    }

    .chat-top {
      display: flex;
      justify-content: space-between;
      padding: 6px 5px 14px;
    }

    .ready {
      color: #7eeaff;
      font-size: 12px;
    }

    #chat {
      min-height: 260px;
      max-height: 520px;
      overflow-y: auto;
      padding: 8px;
    }

    .welcome {
      text-align: center;
      color: #8995a8;
      padding: 65px 15px;
      line-height: 1.7;
    }

    .message {
      display: flex;
      margin: 12px 0;
    }

    .message.user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 85%;
      padding: 13px 15px;
      border-radius: 16px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .user .bubble {
      background: #183247;
      border: 1px solid #2d526d;
    }

    .ai .bubble {
      background: #101827;
      border: 1px solid #202e43;
      color: #dce5f0;
    }

    .composer {
      background: #080e19;
      border: 1px solid #27344b;
      border-radius: 18px;
      padding: 10px;
      margin-top: 10px;
    }

    textarea {
      width: 100%;
      min-height: 80px;
      resize: vertical;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      padding: 8px;
      font-size: 15px;
    }

    .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .left,
    .right {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    button {
      border: 1px solid #30415a;
      background: #111c2d;
      color: #dce8f5;
      border-radius: 11px;
      padding: 10px 14px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      border-color: #6ee7ff;
    }

    .send {
      background: #6ee7ff;
      color: #061019;
      border-color: #6ee7ff;
    }

    .tools-wrap {
      position: relative;
    }

    .tools-menu {
      display: none;
      position: absolute;
      bottom: 48px;
      left: 0;
      width: 245px;
      background: #0c1422;
      border: 1px solid #27344b;
      border-radius: 15px;
      padding: 8px;
      z-index: 20;
      box-shadow: 0 20px 50px rgba(0,0,0,.4);
    }

    .tools-menu.open {
      display: block;
    }

    .tool {
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
      padding: 11px;
      margin: 2px 0;
    }

    .tool:hover {
      background: #142034;
    }

    .tool small {
      display: block;
      color: #8995a8;
      margin-top: 3px;
      font-weight: normal;
    }

    .quick {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 16px;
    }

    .quick button {
      text-align: left;
      min-height: 70px;
    }

    .quick span {
      display: block;
      color: #8995a8;
      font-size: 12px;
      margin-top: 5px;
      font-weight: normal;
    }

    footer {
      text-align: center;
      padding: 40px 20px;
      color: #68758a;
      font-size: 13px;
    }

    @media (max-width: 700px) {
      .quick {
        grid-template-columns: repeat(2, 1fr);
      }

      .bubble {
        max-width: 94%;
      }
    }

    @media (max-width: 480px) {
      .quick {
        grid-template-columns: 1fr;
      }

      .actions {
        align-items: stretch;
      }

      .left,
      .right {
        width: 100%;
      }

      .left button,
      .right button {
        flex: 1;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">NEXORA AI</div>
  <div class="badge">AI POWERED</div>
</header>

<section class="hero">
  <h1>Ask <span>anything.</span></h1>

  <p>
    Chat, write, solve, learn and create from one simple AI workspace.
  </p>
</section>

<main class="workspace">

  <section class="chat-panel">

    <div class="chat-top">
      <strong>Nexora AI</strong>
      <span class="ready">● Ready</span>
    </div>

    <div id="chat">

      <div class="welcome" id="welcome">
        <h2>How can I help?</h2>

        <p>
          Ask Nexora a question, ask it to write something,
          solve a problem, or explore an idea.
        </p>
      </div>

    </div>

    <div class="composer">

      <textarea
        id="prompt"
        placeholder="Ask Nexora anything..."
        onkeydown="handleEnter(event)"
      ></textarea>

      <div class="actions">

        <div class="left">

          <div class="tools-wrap">

            <button onclick="toggleTools()">🔎 Tools</button>

            <div class="tools-menu" id="toolsMenu">

              <button class="tool" onclick="chooseMode('chat')">
                💬 Chat
                <small>Ask anything</small>
              </button>

              <button class="tool" onclick="chooseMode('write')">
                ✍️ Write
                <small>Create or rewrite text</small>
              </button>

              <button class="tool" onclick="chooseMode('image')">
                🖼️ Create Image
                <small>Describe an image</small>
              </button>

              <button class="tool" onclick="chooseMode('study')">
                📚 Learn
                <small>Explain difficult topics</small>
              </button>

              <button class="tool" onclick="chooseMode('math')">
                🧮 Solve
                <small>Math and reasoning</small>
              </button>

              <button class="tool" onclick="chooseMode('ideas')">
                💡 Ideas
                <small>Generate ideas</small>
              </button>

            </div>

          </div>

          <button onclick="clearChat()">Clear</button>

        </div>

        <div class="right">
          <button class="send" id="sendButton" onclick="sendMessage()">
            ➤ Send
          </button>
        </div>

      </div>

    </div>

  </section>

  <div class="quick">

    <button onclick="quickAsk('भारत की राजधानी क्या है?')">
      🧠 <strong>Ask</strong>
      <span>General question</span>
    </button>

    <button onclick="quickAsk('Explain artificial intelligence in simple words.')">
      📚 <strong>Learn</strong>
      <span>Explain a topic</span>
    </button>

    <button onclick="quickAsk('Write a short professional introduction for me.')">
      ✍️ <strong>Write</strong>
      <span>Create text</span>
    </button>

    <button onclick="quickAsk('What is 125 multiplied by 8?')">
      🧮 <strong>Solve</strong>
      <span>Try a calculation</span>
    </button>

  </div>

</main>

<footer>
  © 2026 Nexora AI — One box. Every task.
</footer>

<script>

  let currentMode = "chat";

  function toggleTools() {
    document
      .getElementById("toolsMenu")
      .classList.toggle("open");
  }

  function chooseMode(mode) {

    currentMode = mode;

    const names = {
      chat: "Chat",
      write: "Write",
      image: "Create Image",
      study: "Learn",
      math: "Solve",
      ideas: "Ideas"
    };

    addAIMessage(
      "Mode selected: " +
      names[mode] +
      ".\n\nTell me what you want to do."
    );

    document
      .getElementById("toolsMenu")
      .classList.remove("open");

    document
      .getElementById("prompt")
      .focus();
  }

  function quickAsk(text) {
    document.getElementById("prompt").value = text;
    sendMessage();
  }

  function handleEnter(event) {

    if (event.key === "Enter" && !event.shiftKey) {

      event.preventDefault();

      sendMessage();
    }
  }

  function removeWelcome() {

    const welcome =
      document.getElementById("welcome");

    if (welcome) {
      welcome.remove();
    }
  }

  function addUserMessage(text) {

    removeWelcome();

    const chat =
      document.getElementById("chat");

    const row =
      document.createElement("div");

    row.className =
      "message user";

    const bubble =
      document.createElement("div");

    bubble.className =
      "bubble";

    bubble.textContent =
      text;

    row.appendChild(bubble);

    chat.appendChild(row);

    chat.scrollTop =
      chat.scrollHeight;
  }

  function addAIMessage(text) {

    removeWelcome();

    const chat =
      document.getElementById("chat");

    const row =
      document.createElement("div");

    row.className =
      "message ai";

    const bubble =
      document.createElement("div");

    bubble.className =
      "bubble";

    bubble.textContent =
      text;

    row.appendChild(bubble);

    chat.appendChild(row);

    chat.scrollTop =
      chat.scrollHeight;
  }

  async function sendMessage() {

    const input =
      document.getElementById("prompt");

    const button =
      document.getElementById("sendButton");

    const question =
      input.value.trim();

    if (!question) {

      addAIMessage(
        "Please enter a question first."
      );

      return;
    }

    addUserMessage(question);

    input.value = "";

    button.disabled = true;

    button.textContent = "Thinking...";

    try {

      const response =
        await fetch("/api/ask", {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            question: question,
            mode: currentMode
          })

        });

      const data =
        await response.json();

      if (!response.ok) {

        throw new Error(
          data.reply ||
          "Request failed."
        );
      }

      addAIMessage(
        data.reply ||
        "No response received."
      );

    } catch (error) {

      addAIMessage(
        "Nexora could not connect to the AI service.\n\n" +
        "Please check the API configuration and try again."
      );

      console.error(error);

    } finally {

      button.disabled = false;

      button.textContent = "➤ Send";
    }
  }

  function clearChat() {

    document.getElementById("chat").innerHTML =
      `
      <div class="welcome" id="welcome">
        <h2>How can I help?</h2>

        <p>
          Ask Nexora a question, ask it to write something,
          solve a problem, or explore an idea.
        </p>
      </div>
      `;

    document.getElementById("prompt").value = "";
  }

</script>

</body>
</html>
