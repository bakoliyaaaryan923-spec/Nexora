<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nexora AI v6</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,Arial,sans-serif;background:#080a0f;color:#f5f7fb;min-height:100vh}
button,textarea,input{font:inherit}
.app{min-height:100vh;display:flex}
.sidebar{width:250px;background:#10131a;border-right:1px solid #252a34;padding:18px 14px;display:flex;flex-direction:column;gap:14px}
.logo{font-size:21px;font-weight:800;padding:8px}.logo span{color:#897cff}
.new-chat{border:1px solid #303541;background:#191c24;color:#fff;border-radius:12px;padding:12px;cursor:pointer;text-align:left}
.new-chat:hover{background:#222631}
.history-title{color:#777e8c;font-size:11px;padding:8px;text-transform:uppercase;letter-spacing:.1em}
.history{display:flex;flex-direction:column;gap:4px;overflow:auto}
.history-item{width:100%;border:0;background:transparent;color:#cdd2dc;padding:10px;border-radius:9px;text-align:left;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.history-item:hover{background:#1b1f28}
.sidebar-bottom{margin-top:auto;color:#656c79;font-size:11px;padding:8px}
.main{flex:1;min-width:0;min-height:100vh;display:flex;flex-direction:column}
.topbar{height:62px;border-bottom:1px solid #252a34;display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:#0d0f14}
.status{color:#62e3a0;font-size:12px}
.content{width:min(920px,94%);margin:auto;padding:48px 0 180px}
.hero{text-align:center;margin-bottom:28px}
.hero h1{font-size:clamp(34px,6vw,58px);line-height:1.05;margin-bottom:12px;background:linear-gradient(90deg,#fff,#aaa0ff);-webkit-background-clip:text;color:transparent}
.hero p{color:#9299a7}
.chat{display:flex;flex-direction:column;gap:16px}
.welcome{text-align:center;color:#8c93a0;padding:25px 10px}
.welcome strong{display:block;color:#fff;font-size:20px;margin-bottom:8px}
.message{max-width:84%;padding:14px 16px;border-radius:16px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.user{margin-left:auto;background:#6256d8;border-bottom-right-radius:5px}
.assistant{margin-right:auto;background:#171a22;border:1px solid #292e38;border-bottom-left-radius:5px}
.skill{font-size:11px;color:#8e96a5;margin-bottom:7px}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:25px}
.tool{padding:13px 8px;border-radius:12px;border:1px solid #292e38;background:#14171e;color:#e9ebf0;cursor:pointer}
.tool:hover{background:#1c2029;border-color:#675cdc}
.tool small{display:block;color:#7d8492;margin-top:4px}
.composer-wrap{position:fixed;left:250px;right:0;bottom:0;padding:14px 20px 18px;background:linear-gradient(transparent,#080a0f 25%)}
.composer{width:min(920px,94%);margin:auto;display:flex;align-items:flex-end;gap:8px;padding:9px;background:#151820;border:1px solid #303541;border-radius:17px}
textarea{flex:1;min-height:46px;max-height:150px;resize:none;border:0;outline:0;background:transparent;color:#fff;padding:12px}
textarea::placeholder{color:#707785}
.clear{border:0;background:transparent;color:#858c99;cursor:pointer;padding:11px}
.send{width:47px;height:46px;border:0;border-radius:12px;background:#6b5fe5;color:#fff;cursor:pointer;font-size:18px}
.notice{text-align:center;color:#555c68;font-size:10px;margin-top:7px}
@media(max-width:760px){
.sidebar{display:none}.composer-wrap{left:0}.content{padding-top:35px}
.tools{grid-template-columns:repeat(2,1fr)}.message{max-width:93%}
}
</style>
</head>

<body>
<div class="app">

<aside class="sidebar">
<div class="logo">NEXORA <span>AI</span></div>
<button class="new-chat" onclick="newChat()">＋ New chat</button>
<div class="history-title">History</div>
<div id="history" class="history"></div>
<div class="sidebar-bottom">
FREE LOCAL v6<br>
Skills Engine
</div>
</aside>

<main class="main">
<header class="topbar">
<div>Nexora AI</div>
<div class="status">● Local Ready</div>
</header>

<section class="content">

<div class="hero">
<h1>Ask anything.</h1>
<p>One browser. Multiple local skills. No API required.</p>
</div>

<div id="chat" class="chat">
<div id="welcome" class="welcome">
<strong>Welcome to Nexora AI</strong>
Ask a question or choose a skill below.
</div>
</div>

<div class="tools">
<button class="tool" onclick="toolPrompt('ask')">🧠 Ask<small>Knowledge</small></button>
<button class="tool" onclick="toolPrompt('learn')">📚 Learn<small>Explain</small></button>
<button class="tool" onclick="toolPrompt('write')">✍️ Write<small>Create</small></button>
<button class="tool" onclick="toolPrompt('solve')">🧮 Solve<small>Calculate</small></button>
</div>

</section>
</main>
</div>

<div class="composer-wrap">
<div class="composer">
<textarea id="question" placeholder="Ask Nexora anything..." rows="1"></textarea>
<button class="clear" onclick="newChat()">Clear</button>
<button class="send" onclick="sendMessage()">➤</button>
</div>
<div class="notice">© 2026 Nexora AI · Free Local v6 · No API</div>
</div>

<script>
const chat=document.getElementById("chat");
const box=document.getElementById("question");
const historyBox=document.getElementById("history");

box.addEventListener("keydown",e=>{
 if(e.key==="Enter"&&!e.shiftKey){
   e.preventDefault();
   sendMessage();
 }
});

function addMessage(text,type,skill=""){
 const welcome=document.getElementById("welcome");
 if(welcome)welcome.remove();

 const div=document.createElement("div");
 div.className="message "+type;

 if(type==="assistant"&&skill){
   const label=document.createElement("div");
   label.className="skill";
   label.textContent="⚡ "+skill;
   div.appendChild(label);
 }

 const body=document.createElement("div");
 body.textContent=text;
 div.appendChild(body);

 chat.appendChild(div);
 div.scrollIntoView({behavior:"smooth",block:"end"});
}

function addHistory(text){
 const item=document.createElement("button");
 item.className="history-item";
 item.textContent=text;
 item.onclick=()=>{box.value=text;box.focus()};
 historyBox.prepend(item);
}

function newChat(){
 chat.innerHTML=`
 <div id="welcome" class="welcome">
 <strong>Welcome to Nexora AI</strong>
 Ask a question or choose a skill below.
 </div>`;
 box.value="";
 box.focus();
}

function toolPrompt(type){
 const p={
  ask:"",
  learn:"Explain this topic simply: ",
  write:"Write something about: ",
  solve:"Calculate: "
 };
 box.value=p[type]||"";
 box.focus();
}

/* ---------- CALCULATOR ---------- */

function calculate(text){
 let x=text
 .replace(/×/g,"*")
 .replace(/÷/g,"/")
 .replace(/\^/g,"**")
 .replace(/,/g,"")
 .replace(/\s/g,"");

 if(!/^[0-9+\-*/().%]+$/.test(x))return null;

 try{
   const n=Function('"use strict";return('+x+')')();
   return typeof n==="number"&&Number.isFinite(n)?n:null;
 }catch(e){
   return null;
 }
}

/* ---------- PERCENT ---------- */

function percentage(text){
 const m=text.match(/(\d+(?:\.\d+)?)\s*%\s*(?:of|का|की|के)\s*(\d+(?:\.\d+)?)/i);
 if(!m)return null;

 return Number(m[1])*Number(m[2])/100;
}

/* ---------- KNOWLEDGE ---------- */

const knowledge={

"ai":`AI यानी Artificial Intelligence ऐसी technology है जिसमें computer systems ऐसे काम कर सकते हैं जिनमें human intelligence की जरूरत होती है।

उदाहरण:
• भाषा समझना
• सवालों के जवाब देना
• images पहचानना
• patterns ढूँढना
• predictions करना`,

"computer":`कंप्यूटर एक electronic device है जो data को process करके useful information देता है।

मुख्य चरण:
1. Input
2. Processing
3. Output
4. Storage`,

"water":`पानी का chemical formula H₂O है।

इसमें:
• 2 Hydrogen atoms
• 1 Oxygen atom`,

"solar":`सौर मंडल सूर्य और उसके चारों ओर घूमने वाले ग्रहों तथा अन्य खगोलीय objects का समूह है।
