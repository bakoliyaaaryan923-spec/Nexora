<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>हिसाब किताब – फ्री EMI, SIP, FD, GST, प्रतिशत, डिस्काउंट, उम्र, BMI कैलकुलेटर</title>
<meta name="description" content="फ्री ऑनलाइन कैलकुलेटर: EMI, SIP, FD, GST, प्रतिशत, डिस्काउंट, उम्र और BMI। लिखते ही नतीजा, WhatsApp पर शेयर करें।">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Hind:wght@400;500&display=swap">
<style>
:root{--bg:#eef2f1;--card:#fff;--ink:#12302b;--mut:#5a6f6a;--line:#cfdad7;--acc:#f2b705;--acc-ink:#12302b;--out:#12302b;--out-ink:#f4fbf9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1b19;--card:#142825;--ink:#e6f2ef;--mut:#92aaa4;--line:#27413d;--out:#f2b705;--out-ink:#12302b}}
:root[data-theme="dark"]{--bg:#0d1b19;--card:#142825;--ink:#e6f2ef;--mut:#92aaa4;--line:#27413d;--out:#f2b705;--out-ink:#12302b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 Hind,system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 40px}
h1,h2{font-family:"Baloo 2",system-ui,sans-serif;line-height:1.15;margin:0}
h1{font-size:clamp(30px,7vw,46px);margin-top:10px}
.top{display:flex;justify-content:space-between;align-items:center}
.logo{font:700 20px "Baloo 2",sans-serif}
.sub{color:var(--mut);margin:8px 0 18px;max-width:52ch}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
button{font-family:inherit;cursor:pointer}
.tabs button,.tg{flex:none;font:500 16px Hind,sans-serif;padding:9px 16px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px}
.tabs button[aria-selected=true]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.ad{margin:16px 0;min-height:90px;border:1.5px dashed var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:14px;text-align:center;padding:8px}
.tool{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:20px}
.tool h2{font-size:26px;margin-bottom:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
label{display:block;font-size:15px;color:var(--mut)}
input,select{width:100%;margin-top:4px;font:500 18px Hind,sans-serif;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.res{margin-top:18px;background:var(--out);color:var(--out-ink);border-radius:12px;padding:16px 18px}
.res .big{font:700 34px/1.1 "Baloo 2",sans-serif}
