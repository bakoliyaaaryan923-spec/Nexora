<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nexora AI</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#080808;
  color:white;
}
.app{
  min-height:100vh;
  display:flex;
}
.sidebar{
  width:240px;
  background:#111;
  padding:20px;
  border-right:1px solid #292929;
}
.logo{
  font-size:22px;
  font-weight:bold;
  margin-bottom:25px;
}
.logo span{color:#7d6cff}
.new-chat{
  width:100%;
  padding:12px;
  background:#1c1c1c;
  color:white;
  border:1px solid #333;
  border-radius:10px;
  cursor:pointer;
}
.history-title{
  color:#777;
  font-size:12px;
  margin:25px 0 10px;
}
.history-item{
  width:100%;
  text-align:left;
  padding:9px;
  margin-bottom:4px;
  background:transparent;
  color:#ccc;
  border:0;
  border-radius:8px;
  cursor:pointer;
}
.history-item:hover{background:#222}

.main{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}
.topbar{
  height:60px;
  padding:0 20px;
  border-bottom:1px solid #292929;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.status{color:#65e39c;font-size:13px}

.chat{
  width:min(850px,94%);
  margin:auto;
  flex:1;
  padding:40px 0 150px;
}
.welcome{
  text-align:center;
  color:#888;
  padding:100px 10px;
}
.welcome h1{
  color:white;
  font-size:50px;
  margin-bottom:10px;
}
.message{
  margin:20px 0;
  display:flex;
}
.message.user{justify-content:flex-end}
.bubble{
  max-width:82%;
  padding:14px 17px;
  border-radius:16px;
  line-height:1.6;
  white-space:pre-wrap;
}
.user .bubble{
  background:#6255d8;
}
.assistant .bubble{
  background:#181818;
  border:1px solid #292929;
}
.label{
  color:#8d95a5;
  font-size:11px;
  margin-bottom:5px;
}

.composer-wrap{
  position:fixed;
  bottom:0;
  left:240px;
  right:0;
  padding:15px 20px;
  background:linear-gradient(transparent,#080808 30%);
}
.composer{
  width:min(850px,94%);
  margin:auto;
  display:flex;
  gap:8px;
  padding:8px;
  background:#171717;
  border:1px solid #333;
  border-radius:17px;
}
textarea{
  flex:1;
  resize:none;
  min-height:45px;
  max-height:130px;
  border:0;
  outline:0;
  background:transparent;
  color:white;
  padding:12px;
}
.clear{
  background:transparent;
  color:#888;
  border:0;
  cursor:pointer;
}
.send{
  width:48px;
  height:45px;
  border:0;
  border-radius:12px;
  background:#6d5ce7;
  color:white;
  cursor:pointer;
  font-size:18px;
}
.send:hover{background:#806ff0}
.notice{
  text-align:center;
  color:#555;
  font-size:10px;
  margin-top:6px;
}

@media(max-width:700px){
  .sidebar{display:none}
  .composer-wrap{left:0}
  .welcome h1{font-size:40px}
  .bubble{max-width:92%}
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar">

  <div class="logo">
    NEXORA <span>AI</span>
  </div>

  <button
    class="new-chat"
    id="newChat"
  >
    ＋ New chat
  </button>

  <div class="history-title">
    History
  </div>

  <div id="history"></div>

</aside>


<main class="main">

<header class="topbar">

  <strong>Nexora AI</strong>

  <span
    class="status"
    id="status"
  >
    ● Ready
  </span>

</header>


<section
  class="chat"
  id="chat"
>

  <div
    class="welcome"
    id="welcome"
  >

    <h1>Ask anything.</h1>

    <p>
      Chat, learn, write and solve with Nexora AI.
    </p>

  </div>

</section>

</main>

</div>


<div class="composer-wrap">

<div class="composer">

<textarea
  id="question"
  placeholder="Ask Nexora anything..."
></textarea>

<button
  class="clear"
  id="clear"
>
Clear
</button>

<button
  class="send"
  id="send"
>
➤
</button>

</div>

<div class="notice">
© 2026 Nexora AI · Free Local Mode
</div>

</div>


<script>

const question =
  document.getElementById("question");

const send =
  document.getElementById("send");

const clear =
  document.getElementById("clear");

const newChat =
  document.getElementById("newChat");

const chat =
  document.getElementById("chat");

const history =
  document.getElementById("history");

const status =
  document.getElementById("status");


/* =========================
   LOCAL ANSWER ENGINE
========================= */

function getAnswer(text){

  const q =
    text
      .toLowerCase()
      .trim();


  /* CALCULATOR */

  const expression =
    text
      .replace(/×/g,"*")
      .replace(/÷/g,"/")
      .replace(/−/g,"-")
      .trim();


  if(
    /^[0-9+\-*/().%\s]+$/.test(expression)
  ){

    try{

      const answer =
        Function(
          '"use strict";return (' +
          expression +
          ')'
        )();


      if(
        typeof answer === "number" &&
        Number.isFinite(answer)
      ){

        return {
          text:"🧮 Answer: " + answer,
          skill:"Calculator"
        };

      }

    }catch(e){}

  }


  /* INDIA CAPITAL */

  if(
    q.includes("भारत की राजधानी") ||
    q.includes("capital of india")
  ){

    return {
      text:
        "भारत की राजधानी नई दिल्ली (New Delhi) है।\n\n" +
        "• यहाँ भारत की संसद स्थित है।\n" +
        "• राष्ट्रपति भवन नई दिल्ली में है।\n" +
        "• यह भारत की केंद्र सरकार का प्रमुख केंद्र है।",
      skill:"Knowledge"
    };

  }


  /* CONSTITUTION */

  if(
    q.includes("भारत का संविधान कब लागू हुआ") ||
    q.includes("संविधान कब लागू हुआ")
  ){

    return {
      text:
        "भारत का संविधान 26 जनवरी 1950 को लागू हुआ था।\n\n" +
        "इसी कारण 26 जनवरी को भारत में गणतंत्र दिवस मनाया जाता है।",
      skill:"Knowledge"
    };

  }


  /* AI */

  if(
    q.includes("ai क्या है") ||
    q.includes("ai kya hai") ||
    q.includes("what is ai")
  ){

    return {
      text:
        "AI यानी Artificial Intelligence ऐसी technology है जिसमें computer systems ऐसे काम कर सकते हैं जिनमें आमतौर पर human intelligence की जरूरत होती है।\n\n" +
        "उदाहरण:\n" +
        "• भाषा समझना\n" +
        "• तस्वीरें पहचानना\n" +
        "• सवालों के जवाब देना\n" +
        "• patterns पहचानना",
      skill:"Learning"
    };

  }


  /* HELLO */

  if(
    q === "hello" ||
    q === "hi" ||
    q === "hey" ||
    q === "नमस्ते"
  ){

    return {
      text:
        "नमस्ते! 👋 मैं Nexora AI हूँ।",
      skill:"General"
    };

  }


  /* WRITING */

  if(
    q.includes("paragraph") ||
    q.includes("पैराग्राफ")
  ){

    return {
      text:
        "AI आज की technology का एक महत्वपूर्ण हिस्सा है। यह computers को information समझने, patterns पहचानने और कई intelligent tasks करने में मदद करता है। इसका उपयोग education, communication, business और कई अन्य क्षेत्रों में किया जा रहा है।",
      skill:"Writing"
    };

  }


  /* YOUTUBE */

  if(
    q.includes("youtube") &&
    (
      q.includes("title") ||
      q.includes("टाइटल")
    )
  ){

    return {
      text:
        "🎬 YouTube Title Ideas\n\n" +
        "1. AI क्या है? आसान भाषा में समझें\n" +
        "2. AI कैसे काम करता है?\n" +
        "3. AI की 5 जरूरी बातें\n" +
        "4. AI का इस्तेमाल कैसे करें?\n" +
        "5. AI का Future क्या है?",
      skill:"Creator"
    };

  }


  /* FALLBACK */

  return {
    text:
      "इस सवाल का local answer अभी उपलब्ध नहीं है।\n\n" +
      "आप Calculator, Knowledge, Learning, Writing या Creator feature आज़मा सकते हैं।",
    skill:"General"
  };

}


/* =========================
   ADD MESSAGE
========================= */

function addMessage(
  text,
  type,
  skill
){

  const welcome =
    document.getElementById("welcome");

  if(welcome){
    welcome.remove();
  }


  const message =
    document.createElement("div");

  message.className =
    "message " + type;


  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";


  if(
    type === "assistant"
  ){

    const label =
      document.createElement("div");

    label.className =
      "label";

    label.textContent =
      "⚡ " +
      (skill || "Nexora AI");

    bubble.appendChild(label);

  }


  const body =
    document.createElement("div");

  body.textContent =
    text;


  bubble.appendChild(body);

  message.appendChild(bubble);

  chat.appendChild(message);


  message.scrollIntoView({
    behavior:"smooth",
    block:"end"
  });

}


/* =========================
   SEND
========================= */

function sendMessage(){

  const text =
    question.value.trim();


  if(!text){
    return;
  }


  addMessage(
    text,
    "user"
  );


  question.value = "";

  status.textContent =
    "● Thinking...";


  /*
    Small delay only for
    ChatGPT-like feel.
  */

  setTimeout(function(){

    const answer =
      getAnswer(text);


    addMessage(
      answer.text,
      "assistant",
      answer.skill
    );


    status.textContent =
      "● Ready";

  },250);

}


/* =========================
   BUTTON
========================= */

send.addEventListener(
  "click",
  sendMessage
);


/* =========================
   ENTER
========================= */

question.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =========================
   CLEAR
========================= */

function resetChat(){

  chat.innerHTML = `

    <div
      class="welcome"
      id="welcome"
    >

      <h1>Ask anything.</h1>

      <p>
        Chat, learn, write and solve with Nexora AI.
      </p>

    </div>

  `;

  question.value = "";

  status.textContent =
    "● Ready";

  question.focus();

}


clear.addEventListener(
  "click",
  resetChat
);

newChat.addEventListener(
  "click",
  resetChat
);


/* =========================
   READY
========================= */

question.focus();

</script>

</body>
</html>
