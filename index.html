<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexora AI</title><style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Inter,Arial,sans-serif;
  background:#0b0d12;
  color:#f5f7fb;
  min-height:100vh;
}
button,textarea{font:inherit}

.app{min-height:100vh;display:flex}

.sidebar{
  width:250px;
  background:#10131a;
  border-right:1px solid #252a34;
  padding:18px 14px;
  display:flex;
  flex-direction:column;
  gap:16px;
}

.logo{
  font-size:21px;
  font-weight:800;
  padding:8px;
}
.logo span{color:#887cff}

.new-chat{
  background:#191c24;
  color:#fff;
  border:1px solid #303541;
  border-radius:12px;
  padding:12px;
  cursor:pointer;
  text-align:left;
}
.new-chat:hover{background:#222631}

.history-title{
  color:#777e8c;
  font-size:11px;
  padding:6px 8px 0;
  text-transform:uppercase;
  letter-spacing:.1em;
}

.history{
  display:flex;
  flex-direction:column;
  gap:4px;
  overflow:auto;
}

.history-item{
  width:100%;
  border:0;
  background:transparent;
  color:#cfd3dc;
  padding:10px;
  border-radius:9px;
  text-align:left;
  cursor:pointer;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}
.history-item:hover{background:#1b1f28}

.sidebar-bottom{
  margin-top:auto;
  color:#666d7a;
  font-size:11px;
  padding:8px;
}

.main{
  flex:1;
  min-width:0;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

.topbar{
  height:62px;
  border-bottom:1px solid #252a34;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  background:#0d0f14;
}

.brand{font-weight:700}

.status{
  color:#62e4a1;
  font-size:12px;
}

.content{
  width:min(880px,94%);
  margin:auto;
  padding:55px 0 170px;
}

.hero{text-align:center;margin-bottom:32px}

.hero h1{
  font-size:clamp(34px,6vw,58px);
  margin-bottom:12px;
  line-height:1.05;
  background:linear-gradient(90deg,#fff,#a9a0ff);
  -webkit-background-clip:text;
  color:transparent;
}

.hero p{
  color:#949ba9;
  font-size:15px;
}

.chat{
  display:flex;
  flex-direction:column;
  gap:16px;
}

.welcome{
  text-align:center;
  color:#8d94a2;
  padding:28px 10px;
}

.welcome strong{
  display:block;
  color:#fff;
  font-size:20px;
  margin-bottom:8px;
}

.message{
  max-width:82%;
  padding:14px 16px;
  border-radius:16px;
  line-height:1.55;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.user{
  margin-left:auto;
  background:#6256d8;
  border-bottom-right-radius:5px;
}

.assistant{
  margin-right:auto;
  background:#171a22;
  border:1px solid #292e38;
  border-bottom-left-radius:5px;
}

.tools{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
  margin-top:24px;
}

.tool{
  background:#14171e;
  color:#e9ebf0;
  border:1px solid #292e38;
  border-radius:12px;
  padding:13px 8px;
  cursor:pointer;
}

.tool:hover{
  background:#1b1f28;
  border-color:#655bd7;
}

.tool small{
  display:block;
  color:#7f8694;
  margin-top:4px;
}

.composer-wrap{
  position:fixed;
  left:250px;
  right:0;
  bottom:0;
  padding:14px 20px 18px;
  background:linear-gradient(transparent,#0b0d12 24%);
}

.composer{
  width:min(880px,94%);
  margin:auto;
  display:flex;
  align-items:flex-end;
  gap:8px;
  padding:9px;
  background:#151820;
  border:1px solid #303541;
  border-radius:17px;
  box-shadow:0 12px 40px rgba(0,0,0,.35);
}

textarea{
  flex:1;
  min-height:46px;
  max-height:150px;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
  padding:12px;
}

textarea::placeholder{color:#707785}

.clear{
  border:0;
  background:transparent;
  color:#838a97;
  cursor:pointer;
  padding:11px;
}
.clear:hover{color:#fff}

.send{
  width:47px;
  height:46px;
  border:0;
  border-radius:12px;
  background:#6b5fe5;
  color:#fff;
  cursor:pointer;
  font-size:18px;
}
.send:hover{background:#796df0}

.notice{
  text-align:center;
  color:#555c68;
  font-size:10px;
  margin-top:7px;
}

@media(max-width:760px){
  .sidebar{display:none}
  .composer-wrap{left:0}
  .content{padding-top:35px}
  .tools{grid-template-columns:repeat(2,1fr)}
  .message{max-width:92%}
}
</style></head><body><div class="app"><aside class="sidebar">  <div class="logo">NEXORA <span>AI</span></div><button class="new-chat" onclick="newChat()">＋ New chat</button>

  <div class="history-title">History</div>  <div id="history" class="history"></div>  <div class="sidebar-bottom">
    AI WORKSPACE<br>
    One box. Every task.
  </div></aside><main class="main"><header class="topbar">
  <div class="brand">Nexora AI</div>
  <div class="status">● Ready</div>
</header><section class="content">  <div class="hero">
    <h1>Ask anything.</h1>
    <p>Chat, write, solve and learn from one simple AI workspace.</p>
  </div>  <div id="chat" class="chat"><div id="welcome" class="welcome">
  <strong>Welcome to Nexora AI</strong>
  Ask something to get started.
</div>

  </div>  <div class="tools"><button class="tool" onclick="chooseTool('ask')">
  🧠 Ask
  <small>General question</small>
</button>

<button class="tool" onclick="chooseTool('learn')">
  📚 Learn
  <small>Explain a topic</small>
</button>

<button class="tool" onclick="chooseTool('write')">
  ✍️ Write
  <small>Create text</small>
</button>

<button class="tool" onclick="chooseTool('solve')">
  🧮 Solve
  <small>Calculate</small>
</button>

  </div></section></main>
</div><div class="composer-wrap">  <div class="composer"><textarea
  id="question"
  placeholder="Ask Nexora anything..."
  rows="1"
  onkeydown="handleKey(event)"
></textarea>

<button class="clear" onclick="clearChat()">Clear</button>

<button class="send" onclick="sendMessage()">➤</button>

  </div>  <div class="notice">
    © 2026 Nexora AI
  </div></div><script>

const chat=document.getElementById("chat");
const box=document.getElementById("question");
const history=document.getElementById("history");

function addMessage(text,type){

  const welcome=document.getElementById("welcome");
  if(welcome) welcome.remove();

  const message=document.createElement("div");

  message.className="message "+type;
  message.textContent=text;

  chat.appendChild(message);

  window.scrollTo({
    top:document.body.scrollHeight,
    behavior:"smooth"
  });

  return message;
}

function addHistory(text){

  const item=document.createElement("button");

  item.className="history-item";
  item.textContent=text;

  item.onclick=()=>{
    box.value=text;
    box.focus();
  };

  history.prepend(item);
}

function newChat(){

  chat.innerHTML=`
    <div id="welcome" class="welcome">
      <strong>Welcome to Nexora AI</strong>
      Ask something to get started.
    </div>
  `;

  box.value="";
  box.focus();
}

function clearChat(){
  newChat();
}

function handleKey(event){

  if(event.key==="Enter" && !event.shiftKey){
    event.preventDefault();
    sendMessage();
  }
}

function chooseTool(type){

  const prompts={
    ask:"Ask me anything...",
    learn:"Explain this topic in simple language: ",
    write:"Help me write: ",
    solve:"Solve this: "
  };

  box.value=prompts[type]||"";
  box.focus();
}

function calculate(text){

  const value=text
    .replace(/×/g,"*")
    .replace(/÷/g,"/")
    .replace(/\s/g,"");

  if(!/^[0-9+\-*/().%]+$/.test(value)) return null;

  try{

    const result=Function(
      '"use strict";return ('+value+')'
    )();

    if(typeof result==="number" && Number.isFinite(result)){
      return result;
    }

  }catch(error){}

  return null;
}

function localAnswer(question){

  const q=question.toLowerCase().trim();

  const result=calculate(question);

  if(result!==null){
    return "Answer: "+result;
  }

  if(
    q.includes("bharat ki rajdhani") ||
    q.includes("india ki capital") ||
    q.includes("capital of india")
  ){
    return "भारत की राजधानी नई दिल्ली (New Delhi) है।";
  }

  if(
    q.includes("rajasthan ki rajdhani") ||
    q.includes("rajasthan capital")
  ){
    return "राजस्थान की राजधानी जयपुर (Jaipur) है।";
  }

  if(q==="hello" || q==="hi" || q==="नमस्ते"){
    return "नमस्ते! मैं Nexora AI हूँ। अपना सवाल पूछिए।";
  }

  return null;
}

async function sendMessage(){

  const question=box.value.trim();

  if(!question) return;

  addMessage(question,"user");
  addHistory(question);

  box.value="";

  const local=localAnswer(question);

  if(local){

    setTimeout(()=>{
      addMessage(local,"assistant");
    },250);

    return;
  }

  const reply=addMessage("Nexora is thinking...","assistant");

  try{

    const response=await fetch("/api/ask",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        question:question
      })
    });

    const data=await response.json();

    if(!response.ok){
      throw new Error(data.reply||"AI service error");
    }

    reply.textContent=data.reply||"No response received.";

  }catch(error){

    reply.textContent=
      "AI service is currently unavailable. Please try again later.";

    console.error(error);
  }
}

</script></body>
</html>
