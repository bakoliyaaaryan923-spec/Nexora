<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexora AI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Inter,Arial,sans-serif;
  background:#080808;
  color:#f5f7fb;
  min-height:100vh;
}

button,
textarea{
  font:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
}

.app{
  min-height:100vh;
  display:flex;
}

/* SIDEBAR */

.sidebar{
  width:250px;
  background:#111;
  border-right:1px solid #292929;
  padding:16px;
  display:flex;
  flex-direction:column;
}

.logo{
  font-size:22px;
  font-weight:800;
  padding:8px;
  margin-bottom:14px;
}

.logo span{
  color:#897cff;
}

.new-chat{
  width:100%;
  border:1px solid #333;
  background:#191919;
  color:#fff;
  border-radius:10px;
  padding:12px;
  cursor:pointer;
  text-align:left;
}

.new-chat:hover{
  background:#232323;
}

.history-title{
  color:#777;
  font-size:11px;
  margin:22px 8px 8px;
  text-transform:uppercase;
  letter-spacing:.08em;
}

.history{
  display:flex;
  flex-direction:column;
  gap:4px;
  overflow:auto;
  max-height:350px;
}

.history-item{
  width:100%;
  border:0;
  background:transparent;
  color:#ccc;
  padding:10px;
  border-radius:8px;
  text-align:left;
  cursor:pointer;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.history-item:hover{
  background:#202020;
}

.sidebar-bottom{
  margin-top:auto;
  color:#666;
  font-size:11px;
  padding:8px;
}

/* MAIN */

.main{
  flex:1;
  min-width:0;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

.topbar{
  height:60px;
  border-bottom:1px solid #292929;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  background:#0d0d0d;
}

.brand{
  font-weight:700;
}

.status{
  color:#66e3a0;
  font-size:12px;
}

.status.thinking{
  color:#c4baff;
}

.status.error{
  color:#ff8d8d;
}

/* CHAT */

.chat{
  width:min(900px,94%);
  margin:auto;
  flex:1;
  padding:40px 0 160px;
}

.welcome{
  text-align:center;
  color:#888;
  padding:100px 10px 50px;
}

.welcome h1{
  color:#fff;
  font-size:clamp(38px,6vw,56px);
  margin-bottom:12px;
}

.welcome p{
  color:#888;
}

.message{
  display:flex;
  margin:20px 0;
  line-height:1.65;
}

.message.user{
  justify-content:flex-end;
}

.bubble{
  max-width:84%;
  padding:14px 17px;
  border-radius:16px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.user .bubble{
  background:#6256d8;
  border-bottom-right-radius:5px;
}

.assistant .bubble{
  background:#181818;
  border:1px solid #292929;
  border-bottom-left-radius:5px;
}

.label{
  color:#929aaa;
  font-size:11px;
  margin-bottom:6px;
}

/* TYPING */

.typing{
  display:flex;
  gap:5px;
  align-items:center;
  height:20px;
}

.typing span{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#aaa;
  animation:blink 1s infinite;
}

.typing span:nth-child(2){
  animation-delay:.15s;
}

.typing span:nth-child(3){
  animation-delay:.3s;
}

@keyframes blink{
  0%,80%,100%{
    opacity:.25;
  }
  40%{
    opacity:1;
  }
}

/* COMPOSER */

.composer-wrap{
  position:fixed;
  left:250px;
  right:0;
  bottom:0;
  padding:15px 20px 18px;
  background:linear-gradient(
    transparent,
    #080808 30%
  );
}

.composer{
  width:min(900px,94%);
  margin:auto;
  display:flex;
  align-items:flex-end;
  gap:8px;
  padding:8px;
  background:#171717;
  border:1px solid #353535;
  border-radius:17px;
}

textarea{
  flex:1;
  min-height:46px;
  max-height:150px;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
  padding:12px;
}

textarea::placeholder{
  color:#707070;
}

.clear{
  border:0;
  background:transparent;
  color:#888;
  padding:11px;
  cursor:pointer;
}

.send{
  width:47px;
  height:46px;
  border:0;
  border-radius:12px;
  background:#6b5fe5;
  color:#fff;
  cursor:pointer;
  font-size:18px;
}

.send:hover{
  background:#7a6ff0;
}

.send:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.notice{
  text-align:center;
  color:#555;
  font-size:10px;
  margin-top:7px;
}

/* MOBILE */

@media(max-width:760px){

  .sidebar{
    display:none;
  }

  .composer-wrap{
    left:0;
  }

  .chat{
    padding-top:25px;
  }

  .bubble{
    max-width:93%;
  }

  .welcome{
    padding-top:80px;
  }
}
</style>
</head>

<body>

<div class="app">

  <aside class="sidebar">

    <div class="logo">
      NEXORA <span>AI</span>
    </div>

    <button
      class="new-chat"
      id="newChatButton"
    >
      ＋ New chat
    </button>

    <div class="history-title">
      History
    </div>

    <div
      id="history"
      class="history"
    ></div>

    <div class="sidebar-bottom">
      Nexora AI<br>
      Local + AI Backend
    </div>

  </aside>


  <main class="main">

    <header class="topbar">

      <div class="brand">
        Nexora AI
      </div>

      <div
        id="status"
        class="status"
      >
        ● Ready
      </div>

    </header>


    <section
      id="chat"
      class="chat"
    >

      <div
        id="welcome"
        class="welcome"
      >

        <h1>
          Ask anything.
        </h1>

        <p>
          Chat, learn, write and solve with Nexora AI.
        </p>

      </div>

    </section>

  </main>

</div>


<div class="composer-wrap">

  <div class="composer">

    <textarea
      id="question"
      placeholder="Ask Nexora anything..."
      rows="1"
    ></textarea>

    <button
      class="clear"
      id="clearButton"
    >
      Clear
    </button>

    <button
      class="send"
      id="sendButton"
    >
      ➤
    </button>

  </div>

  <div class="notice">
    © 2026 Nexora AI
  </div>

</div>


<script>

/* =====================================================
   ELEMENTS
===================================================== */

const questionBox =
  document.getElementById("question");

const sendButton =
  document.getElementById("sendButton");

const clearButton =
  document.getElementById("clearButton");

const newChatButton =
  document.getElementById("newChatButton");

const chat =
  document.getElementById("chat");

const historyBox =
  document.getElementById("history");

const status =
  document.getElementById("status");


/* =====================================================
   STATE
===================================================== */

const HISTORY_KEY =
  "nexora_chat_history_v8";

let conversation = [];

let activeChatId = null;


/* =====================================================
   LOCAL ENGINE
===================================================== */

function getLocalAnswer(text){

  const q =
    text
      .toLowerCase()
      .trim();


  /* CALCULATOR */

  const expression =
    text
      .replace(/×/g,"*")
      .replace(/÷/g,"/")
      .replace(/−/g,"-")
      .trim();


  if(
    /^[0-9+\-*/().%\s]+$/.test(expression)
  ){

    try{

      const result =
        Function(
          '"use strict";return (' +
          expression +
          ')'
        )();


      if(
        typeof result === "number" &&
        Number.isFinite(result)
      ){

        return {
          answer:
            "🧮 Answer: " + result,

          skill:
            "Calculator"
        };

      }

    }catch(error){}

  }


  /* INDIA CAPITAL */

  if(
    q.includes("भारत की राजधानी") ||
    q.includes("capital of india")
  ){

    return {
      answer:
        "भारत की राजधानी नई दिल्ली (New Delhi) है।\n\n" +
        "• यहाँ भारत की संसद स्थित है।\n" +
        "• राष्ट्रपति भवन नई दिल्ली में है।\n" +
        "• यह भारत की केंद्र सरकार का प्रमुख केंद्र है।",

      skill:
        "Knowledge"
    };

  }


  /* CONSTITUTION */

  if(
    q.includes("भारत का संविधान कब लागू हुआ") ||
    q.includes("संविधान कब लागू हुआ") ||
    q.includes("constitution of india")
  ){

    return {
      answer:
        "भारत का संविधान 26 जनवरी 1950 को लागू हुआ था।\n\n" +
        "इसी कारण 26 जनवरी को भारत में गणतंत्र दिवस मनाया जाता है।",

      skill:
        "Knowledge"
    };

  }


  /* AI */

  if(
    q.includes("ai क्या है") ||
    q.includes("ai kya hai") ||
    q.includes("what is ai")
  ){

    return {
      answer:
        "AI यानी Artificial Intelligence ऐसी technology है जिसमें computer systems ऐसे काम कर सकते हैं जिनमें आमतौर पर human intelligence की जरूरत होती है।\n\n" +
        "उदाहरण:\n" +
        "• भाषा समझना\n" +
        "• तस्वीरें पहचानना\n" +
        "• सवालों के जवाब देना\n" +
        "• patterns पहचानना",

      skill:
        "Learning"
    };

  }


  /* HELLO */

  if(
    q === "hello" ||
    q === "hi" ||
    q === "hey" ||
    q === "नमस्ते"
  ){

    return {
      answer:
        "नमस्ते! 👋 मैं Nexora AI हूँ।",

      skill:
        "General"
    };

  }


  /* WRITING */

  if(
    q.includes("paragraph") ||
    q.includes("पैराग्राफ")
  ){

    return {
      answer:
        "AI आज की technology का एक महत्वपूर्ण हिस्सा है। यह computers को information समझने, patterns पहचानने और कई intelligent tasks करने में मदद करता है। इसका उपयोग education, communication, business और कई अन्य क्षेत्रों में किया जा रहा है।",

      skill:
        "Writing"
    };

  }


  /* YOUTUBE */

  if(
    q.includes("youtube") &&
    (
      q.includes("title") ||
      q.includes("टाइटल")
    )
  ){

    return {
      answer:
        "🎬 YouTube Title Ideas\n\n" +
        "1. AI क्या है? आसान भाषा में समझें\n" +
        "2. AI कैसे काम करता है?\n" +
        "3. AI की 5 जरूरी बातें\n" +
        "4. AI का इस्तेमाल कैसे करें?\n" +
        "5. AI का Future क्या है?",

      skill:
        "Creator"
    };

  }


  /*
    IMPORTANT:

    null का मतलब:
    Local engine को answer नहीं मिला।

    तब sendMessage() backend को call करेगा।
  */

  return null;

}


/* =====================================================
   ADD MESSAGE
===================================================== */

function addMessage(
  text,
  role,
  skill = ""
){

  const welcome =
    document.getElementById("welcome");

  if(welcome){
    welcome.remove();
  }


  const wrapper =
    document.createElement("div");

  wrapper.className =
    "message " + role;


  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";


  if(
    role === "assistant"
  ){

    const label =
      document.createElement("div");

    label.className =
      "label";

    label.textContent =
      "⚡ " +
      (skill || "Nexora AI");

    bubble.appendChild(label);

  }


  const body =
    document.createElement("div");

  body.textContent =
    String(text || "");


  bubble.appendChild(body);

  wrapper.appendChild(bubble);

  chat.appendChild(wrapper);


  wrapper.scrollIntoView({
    behavior:"smooth",
    block:"end"
  });

}


/* =====================================================
   TYPING
===================================================== */

function showTyping(){

  removeTyping();


  const wrapper =
    document.createElement("div");

  wrapper.id =
    "typingMessage";

  wrapper.className =
    "message assistant";


  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";


  const label =
    document.createElement("div");

  label.className =
    "label";

  label.textContent =
    "⚡ Nexora AI";


  const typing =
    document.createElement("div");

  typing.className =
    "typing";

  typing.innerHTML =
    "<span></span><span></span><span></span>";


  bubble.appendChild(label);

  bubble.appendChild(typing);

  wrapper.appendChild(bubble);

  chat.appendChild(wrapper);


  wrapper.scrollIntoView({
    behavior:"smooth",
    block:"end"
  });

}


function removeTyping(){

  const typing =
    document.getElementById(
      "typingMessage"
    );

  if(typing){
    typing.remove();
  }

}


/* =====================================================
   BACKEND CALL
===================================================== */

async function askBackend(){

  /*
    We send the conversation so the backend
    can understand the current chat.
  */

  const response =
    await fetch(
      "/api/ask",
      {
        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({

            messages:
              conversation.slice(-20)

          })
      }
    );


  let data = {};

  try{

    data =
      await response.json();

  }catch(error){

    throw new Error(
      "Backend ने valid JSON response नहीं दिया।"
    );

  }


  if(!response.ok){

    throw new Error(
      data?.reply ||
      data?.error ||
      "Backend request failed."
    );

  }


  const answer =
    data?.reply ||
    data?.answer ||
    data?.message;


  if(!answer){

    throw new Error(
      "Backend से कोई answer नहीं मिला।"
    );

  }


  return String(answer);

}


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage(){

  const text =
    questionBox.value.trim();


  if(!text){

    questionBox.focus();

    return;

  }


  /* USER MESSAGE */

  addMessage(
    text,
    "user"
  );


  conversation.push({

    role:
      "user",

    content:
      text

  });


  questionBox.value = "";

  sendButton.disabled = true;

  status.textContent =
    "● Thinking...";

  status.className =
    "status thinking";


  try{

    /*
      1. LOCAL FIRST
    */

    const local =
      getLocalAnswer(text);


    if(local){

      await wait(250);


      addMessage(

        local.answer,

        "assistant",

        local.skill

      );


      conversation.push({

        role:
          "assistant",

        content:
          local.answer

      });


      saveCurrentChat();


      status.textContent =
        "● Local Ready";

      status.className =
        "status";


      return;

    }


    /*
      2. LOCAL ANSWER नहीं मिला
         अब BACKEND CALL होगा।
    */

    showTyping();


    const answer =
      await askBackend();


    removeTyping();


    addMessage(

      answer,

      "assistant",

      "AI"

    );


    conversation.push({

      role:
        "assistant",

      content:
        answer

    });


    saveCurrentChat();


    status.textContent =
      "● AI Ready";

    status.className =
      "status";


  }catch(error){

    console.error(
      "Nexora backend error:",
      error
    );


    removeTyping();


    addMessage(

      "अभी AI service से जवाब नहीं मिल पाया। " +
      "Local features अभी भी काम कर रहे हैं।",

      "assistant",

      "Nexora"

    );


    status.textContent =
      "● Local Ready";

    status.className =
      "status error";


  }finally{

    sendButton.disabled =
      false;

    questionBox.focus();

  }

}


/* =====================================================
   SAVE CHAT
===================================================== */

function saveCurrentChat(){

  if(
    conversation.length === 0
  ){
    return;
  }


  try{

    const chats =
      JSON.parse(

        localStorage.getItem(
          HISTORY_KEY
        ) || "[]"

      );


    if(!activeChatId){

      activeChatId =
        Date.now().toString();

    }


    const firstUser =
      conversation.find(
        item =>
          item.role === "user"
      );


    if(!firstUser){
      return;
    }


    const index =
      chats.findIndex(
        item =>
          item.id === activeChatId
      );


    const chatData = {

      id:
        activeChatId,

      title:
        firstUser.content
          .slice(0,60),

      messages:
        conversation,

      time:
        Date.now()

    };


    if(index >= 0){

      chats[index] =
        chatData;

    }else{

      chats.push(
        chatData
      );

    }


    localStorage.setItem(

      HISTORY_KEY,

      JSON.stringify(
        chats.slice(-30)
      )

    );


    renderHistory();

  }catch(error){

    console.warn(
      "Could not save chat:",
      error
    );

  }

}


/* =====================================================
   HISTORY
===================================================== */

function renderHistory(){

  historyBox.innerHTML = "";


  try{

    const chats =
      JSON.parse(

        localStorage.getItem(
          HISTORY_KEY
        ) || "[]"

      );


    chats
      .slice()
      .reverse()
      .forEach(item => {

        const button =
          document.createElement(
            "button"
          );


        button.className =
          "history-item";


        button.textContent =
          item.title ||
          "New chat";


        button.addEventListener(
          "click",
          function(){

            loadChat(item);

          }
        );


        historyBox.appendChild(
          button
        );

      });

  }catch(error){

    console.warn(
      "History error:",
      error
    );

  }

}


/* =====================================================
   LOAD CHAT
===================================================== */

function loadChat(item){

  conversation =
    Array.isArray(item.messages)
      ? item.messages
      : [];


  activeChatId =
    item.id || null;


  chat.innerHTML = "";


  conversation.forEach(message => {

    addMessage(

      message.content,

      message.role,

      message.role === "assistant"
        ? "AI"
        : ""

    );

  });


  status.textContent =
    "● Ready";

  status.className =
    "status";

}


/* =====================================================
   NEW CHAT
===================================================== */

function newChat(){

  conversation = [];

  activeChatId = null;

  removeTyping();


  chat.innerHTML = `

    <div
      id="welcome"
      class="welcome"
    >

      <h1>
        Ask anything.
      </h1>

      <p>
        Chat, learn, write and solve with Nexora AI.
      </p>

    </div>

  `;


  questionBox.value = "";

  status.textContent =
    "● Ready";

  status.className =
    "status";

  questionBox.focus();

}


/* =====================================================
   EVENTS
===================================================== */

sendButton.addEventListener(
  "click",
  sendMessage
);


clearButton.addEventListener(
  "click",
  newChat
);


newChatButton.addEventListener(
  "click",
  newChat
);


questionBox.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =====================================================
   WAIT
===================================================== */

function wait(ms){

  return new Promise(
    resolve =>
      setTimeout(resolve,ms)
  );

}


/* =====================================================
   START
===================================================== */

renderHistory();

questionBox.focus();

</script>

</body>
</html>
