<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexora AI v5</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,Arial,sans-serif;background:#080a0f;color:#f5f7fb;min-height:100vh}
button,textarea,input{font:inherit}
.app{min-height:100vh;display:flex}
.sidebar{width:250px;background:#10131a;border-right:1px solid #252a34;padding:18px 14px;display:flex;flex-direction:column;gap:14px}
.logo{font-size:21px;font-weight:800;padding:8px}.logo span{color:#897cff}
.new-chat{border:1px solid #303541;background:#191c24;color:white;border-radius:12px;padding:12px;cursor:pointer;text-align:left}
.new-chat:hover{background:#222631}
.history-title{color:#777e8c;font-size:11px;padding:8px;text-transform:uppercase;letter-spacing:.1em}
.history{display:flex;flex-direction:column;gap:4px;overflow:auto}
.history-item{width:100%;border:0;background:transparent;color:#cdd2dc;padding:10px;border-radius:9px;text-align:left;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.history-item:hover{background:#1b1f28}
.sidebar-bottom{margin-top:auto;color:#656c79;font-size:11px;padding:8px}
.main{flex:1;min-width:0;min-height:100vh;display:flex;flex-direction:column}
.topbar{height:62px;border-bottom:1px solid #252a34;display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:#0d0f14}
.status{color:#62e3a0;font-size:12px}
.content{width:min(920px,94%);margin:auto;padding:48px 0 180px}
.hero{text-align:center;margin-bottom:28px}
.hero h1{font-size:clamp(34px,6vw,58px);line-height:1.05;margin-bottom:12px;background:linear-gradient(90deg,#fff,#aaa0ff);-webkit-background-clip:text;color:transparent}
.hero p{color:#9299a7}
.chat{display:flex;flex-direction:column;gap:16px}
.welcome{text-align:center;color:#8c93a0;padding:25px 10px}
.welcome strong{display:block;color:white;font-size:20px;margin-bottom:8px}
.message{max-width:84%;padding:14px 16px;border-radius:16px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.user{margin-left:auto;background:#6256d8;border-bottom-right-radius:5px}
.assistant{margin-right:auto;background:#171a22;border:1px solid #292e38;border-bottom-left-radius:5px}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:25px}
.tool{padding:13px 8px;border-radius:12px;border:1px solid #292e38;background:#14171e;color:#e9ebf0;cursor:pointer}
.tool:hover{background:#1c2029;border-color:#675cdc}
.tool small{display:block;color:#7d8492;margin-top:4px}
.composer-wrap{position:fixed;left:250px;right:0;bottom:0;padding:14px 20px 18px;background:linear-gradient(transparent,#080a0f 25%)}
.composer{width:min(920px,94%);margin:auto;display:flex;align-items:flex-end;gap:8px;padding:9px;background:#151820;border:1px solid #303541;border-radius:17px}
textarea{flex:1;min-height:46px;max-height:150px;resize:none;border:0;outline:0;background:transparent;color:white;padding:12px}
textarea::placeholder{color:#707785}
.clear{border:0;background:transparent;color:#858c99;cursor:pointer;padding:11px}
.send{width:47px;height:46px;border:0;border-radius:12px;background:#6b5fe5;color:white;cursor:pointer;font-size:18px}
.notice{text-align:center;color:#555c68;font-size:10px;margin-top:7px}
@media(max-width:760px){.sidebar{display:none}.composer-wrap{left:0}.content{padding-top:35px}.tools{grid-template-columns:repeat(2,1fr)}.message{max-width:93%}}
</style>
</head>

<body>
<div class="app">

<aside class="sidebar">
<div class="logo">NEXORA <span>AI</span></div>

<button class="new-chat" onclick="newChat()">＋ New chat</button>

<div class="history-title">History</div>
<div id="history" class="history"></div>

<div class="sidebar-bottom">
FREE LOCAL v5<br>
Content Creator Mode
</div>
</aside>

<main class="main">
<header class="topbar">
<div>Nexora AI</div>
<div class="status">● Local Ready</div>
</header>

<section class="content">

<div class="hero">
<h1>Ask anything.</h1>
<p>Learn, create, calculate and write — directly in your browser.</p>
</div>

<div id="chat" class="chat">
<div id="welcome" class="welcome">
<strong>Welcome to Nexora AI</strong>
Ask a question or choose a tool below.
</div>
</div>

<div class="tools">
<button class="tool" onclick="chooseTool('ask')">🧠 Ask<small>General question</small></button>
<button class="tool" onclick="chooseTool('learn')">📚 Learn<small>Explain simply</small></button>
<button class="tool" onclick="chooseTool('write')">✍️ Write<small>Create content</small></button>
<button class="tool" onclick="chooseTool('solve')">🧮 Solve<small>Calculator</small></button>
</div>

</section>
</main>
</div>

<div class="composer-wrap">
<div class="composer">

<textarea id="question"
placeholder="Ask Nexora anything..."
rows="1"
onkeydown="handleKey(event)"></textarea>

<button class="clear" onclick="clearChat()">Clear</button>
<button class="send" onclick="sendMessage()">➤</button>

</div>

<div class="notice">© 2026 Nexora AI · Free Local v5</div>
</div>

<script>
const chat=document.getElementById("chat");
const box=document.getElementById("question");
const historyBox=document.getElementById("history");

function addMessage(text,type){
 const welcome=document.getElementById("welcome");
 if(welcome) welcome.remove();

 const div=document.createElement("div");
 div.className="message "+type;
 div.textContent=text;
 chat.appendChild(div);

 window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
}

function addHistory(text){
 const item=document.createElement("button");
 item.className="history-item";
 item.textContent=text;
 item.onclick=()=>{box.value=text;box.focus()};
 historyBox.prepend(item);
}

function newChat(){
 chat.innerHTML=`
 <div id="welcome" class="welcome">
 <strong>Welcome to Nexora AI</strong>
 Ask a question or choose a tool below.
 </div>`;
 box.value="";
 box.focus();
}

function clearChat(){newChat()}

function handleKey(e){
 if(e.key==="Enter"&&!e.shiftKey){
   e.preventDefault();
   sendMessage();
 }
}

function chooseTool(type){
 const prompts={
   ask:"",
   learn:"Explain this topic in simple language: ",
   write:"Write content about: ",
   solve:"Calculate: "
 };
 box.value=prompts[type]||"";
 box.focus();
}

/* Calculator */

function calculate(expression){
 let value=expression
 .replace(/×/g,"*")
 .replace(/÷/g,"/")
 .replace(/\^/g,"**")
 .replace(/\s/g,"");

 if(!/^[0-9+\-*/().%]+$/.test(value)) return null;

 try{
   const result=Function('"use strict";return ('+value+')')();
   if(typeof result==="number"&&Number.isFinite(result)) return result;
 }catch(e){}

 return null;
}

/* Content generators */

function youtubeTitle(topic){
 topic=topic.replace(/youtube|video|title|kaise|likhe|likhen|generate|banao|banaye/gi,"").trim();

 if(!topic) topic="YouTube Video";

 return `🎬 YouTube Title Ideas

1. ${topic} — पूरी जानकारी आसान भाषा में
2. ${topic} के बारे में ये बातें जरूर जानें!
3. ${topic} कैसे करें? आसान तरीका
4. ${topic}: Beginners के लिए Complete Guide
5. ${topic} की 5 जरूरी बातें`;
}

function youtubeDescription(topic){
 topic=topic
 .replace(/youtube|video|description|discription|title|kaise|likhe|likhen|generate|banao|banaye/gi,"")
 .trim();

 if(!topic) topic="इस वीडियो";

 return `📝 YouTube Description

आज के इस वीडियो में हम ${topic} के बारे में आसान भाषा में जानकारी समझेंगे।

इस वीडियो में आपको useful tips और जरूरी जानकारी मिलेगी। वीडियो पसंद आए तो Like करें और channel को Subscribe करें।

📌 Topic: ${topic}

#YouTube #NexoraAI #Information`;
}

function videoIdeas(topic){
 topic=topic.replace(/video|ideas|idea|banao|banaye|generate/gi,"").trim();

 if(!topic) topic="AI और Technology";

 return `💡 Video Ideas: ${topic}

1. ${topic} क्या है?
2. ${topic} कैसे काम करता है?
3. Beginners की 5 common mistakes
4. ${topic} के 5 useful tips
5. ${topic}: Complete Beginner Guide
6. ${topic} से जुड़े जरूरी सवाल-जवाब
7. ${topic} का future`;
}

function hashtags(topic){
 topic=topic.trim();

 return `#${topic.replace(/\s+/g,"")} #YouTube #Shorts #NexoraAI #Hindi #Tips #Learn #Technology`;
}

function caption(topic){
 topic=topic.trim()||"आपका नया वीडियो";

 return `✨ ${topic}

अगर आपको यह content useful लगा हो तो Like, Share और Follow जरूर करें।

आपका support हमें और बेहतर content बनाने के लिए motivate करता है।`;
}

/* Knowledge */

function knowledge(q){

 if(q.includes("ai kya hai")||q.includes("what is ai")||q.includes("artificial intelligence")||q.includes("एआई क्या है")){
 return `AI यानी Artificial Intelligence ऐसी technology है जिसमें computer systems ऐसे काम कर सकते हैं जिनमें सामान्यतः human intelligence की जरूरत होती है।

उदाहरण:
• भाषा समझना
• सवालों के जवाब देना
• images पहचानना
• patterns ढूँढना
• predictions करना`;
 }

 if(q.includes("bharat ki rajdhani")||q.includes("capital of india")||q.includes("भारत की राजधानी")){
 return `भारत की राजधानी नई दिल्ली (New Delhi) है।

3 महत्वपूर्ण बातें:
1. नई दिल्ली भारत की राष्ट्रीय राजधानी है।
2. यहाँ भारत की संसद स्थित है।
3. यहाँ राष्ट्रपति भवन और कई केंद्रीय सरकारी कार्यालय स्थित हैं।`;
 }

 if(q.includes("rajasthan ki rajdhani")||q.includes("rajasthan capital")||q.includes("राजस्थान की राजधानी")){
 return `राजस्थान की राजधानी जयपुर (Jaipur) है।

जयपुर को "Pink City" के नाम से भी जाना जाता है।`;
 }

 if(q.includes("water formula")||q.includes("pani ka formula")||q.includes("पानी का सूत्र")){
 return "पानी का chemical formula H₂O है। इसमें दो hydrogen atoms और एक oxygen atom होते हैं।";
 }

 if(q.includes("solar system")||q.includes("saur mandal")||q.includes("सौर मंडल")){
 return `सौर मंडल सूर्य और उसके चारों ओर घूमने वाले ग्रहों तथा अन्य खगोलीय objects का समूह है।

सौर मंडल में 8 ग्रह हैं:
Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus और Neptune।`;
 }

 if(q.includes("computer kya hai")||q.includes("what is computer")||q.includes("कंप्यूटर क्या है")){
 return `कंप्यूटर एक electronic device है जो data को process करके useful information देता है।

इसके मुख्य काम:
1. Input
2. Processing
3. Output
4. Storage`;
 }

 return null;
}

/* Main local brain */

function localAnswer(question){

 const q=question.toLowerCase().trim();

 const calc=calculate(question);
 if(calc!==null) return "🧮 Answer: "+calc;

 if(q==="hi"||q==="hello"||q==="hey"||q==="नमस्ते"){
   return "नमस्ते! मैं Nexora AI हूँ। अपना सवाल पूछिए।";
 }

 /* YouTube */

 if(
   q.includes("youtube")&&
   (q.includes("title")||q.includes("टाइटल"))
 ){
   return youtubeTitle(question);
 }

 if(
   (q.includes("youtube")||q.includes("video"))&&
   (q.includes("description")||q.includes("discription")||q.includes("डिस्क्रिप्शन"))
 ){
   return youtubeDescription(question);
 }

 if(
   q.includes("video")&&
   (q.includes("idea")||q.includes("ideas")||q.includes("आइडिया"))
 ){
   return videoIdeas(question);
 }

 if(
   q.includes("hashtag")||
   q.includes("hashtags")||
   q.includes("हैशटैग")
 ){
   return hashtags(question);
 }

 if(
   q.includes("caption")||
   q.includes("कैप्शन")
 ){
   return caption(question);
 }

 /* Translation */

 if(q.startsWith("translate ")||q.startsWith("अनुवाद ")){
   const text=question.replace(/^translate\s*/i,"").replace(/^अनुवाद\s*/i,"").trim();

   const dict={
     "नमस्ते":"Hello",
     "धन्यवाद":"Thank you",
     "पानी":"Water",
     "किताब":"Book",
     "भारत":"India",
     "राजस्थान":"Rajasthan",
     "जयपुर":"Jaipur"
   };

   if(dict[text]) return "English: "+dict[text];

   return "अभी basic Hindi → English translation उपलब्ध है।";
 }

 /* General knowledge */

 const known=knowledge(q);
 if(known) return known;

 /* Fallback */

 return `मैं Nexora AI Free Local v5 में चल रहा हूँ।

मैं अभी बिना API के इन कामों में मदद कर सकता हूँ:

🎬 YouTube title generate करना
📝 YouTube description बनाना
💡 Video ideas देना
#️⃣ Hashtags बनाना
✍️ Caption बनाना
📚 Basic topics समझाना
🔤 Basic translation
🧮 Calculations

उदाहरण:
• YouTube video title generate करो: AI
• YouTube description लिखो: मेरा नया वीडियो
• Video ideas दो: Technology
• Hashtags दो: AI
• AI क्या है?
• 25 × 12`;
}

function sendMessage(){

 const question=box.value.trim();
 if(!question) return;

 addMessage(question,"user");
 addHistory(question);
 box.value="";

 const answer=localAnswer(question);

 setTimeout(()=>{
   addMessage(answer,"assistant");
 },220);
}
</script>

</body>
</html>
