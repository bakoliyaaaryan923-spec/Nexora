<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexora AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #070b14;
      color: white;
      min-height: 100vh;
    }

    header {
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #202838;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #6ee7ff;
    }

    .badge {
      background: #11182b;
      color: #9defff;
      padding: 8px 12px;
      border-radius: 20px;
      font-size: 12px;
    }

    .hero {
      text-align: center;
      padding: 50px 20px 30px;
    }

    .hero h1 {
      font-size: 42px;
      line-height: 1.1;
      margin-bottom: 15px;
    }

    .hero h1 span {
      color: #6ee7ff;
    }

    .hero p {
      color: #9ca8bc;
      max-width: 560px;
      margin: auto;
      line-height: 1.6;
    }

    .workspace {
      max-width: 850px;
      margin: 20px auto;
      padding: 20px;
    }

    .panel {
      background: #0e1524;
      border: 1px solid #27344b;
      border-radius: 20px;
      padding: 20px;
    }

    .panel h2 {
      margin-bottom: 15px;
    }

    .input,
    textarea,
    select {
      width: 100%;
      background: #080e1b;
      color: white;
      border: 1px solid #29364d;
      border-radius: 12px;
      padding: 14px;
      outline: none;
      font-size: 15px;
      margin-bottom: 12px;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    button {
      background: #6ee7ff;
      color: #061019;
      border: 0;
      border-radius: 12px;
      padding: 12px 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button.secondary {
      background: #182338;
      color: #dcecff;
    }

    button:hover {
      opacity: 0.9;
    }

    #output {
      display: none;
      margin-top: 18px;
      background: #080e1b;
      border: 1px solid #29364d;
      border-radius: 15px;
      padding: 18px;
      color: #d8e2f0;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .tools {
      max-width: 950px;
      margin: 10px auto;
      padding: 20px;
    }

    .tools h2 {
      margin-bottom: 18px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .card {
      background: #0e1524;
      border: 1px solid #292f40;
      border-radius: 18px;
      padding: 22px;
      cursor: pointer;
      transition: 0.2s;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: #6ee7ff;
    }

    .icon {
      font-size: 30px;
      margin-bottom: 12px;
    }

    .card h3 {
      margin-bottom: 8px;
    }

    .card p {
      color: #8995a8;
      font-size: 14px;
      line-height: 1.5;
    }

      text-align: center;
      padding: 40px 20px;
      color: #68758a;
