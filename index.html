<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nexora AI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Inter,Arial,sans-serif;
  background:#080808;
  color:#f5f7fb;
  min-height:100vh;
}

button,
textarea{
  font:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
}

.app{
  min-height:100vh;
  display:flex;
}

/* SIDEBAR */

.sidebar{
  width:260px;
  background:#111;
  border-right:1px solid #292929;
  padding:15px;
  display:flex;
  flex-direction:column;
}

.logo{
  font-size:21px;
  font-weight:800;
  padding:10px;
  margin-bottom:10px;
}

.logo span{
  color:#8b7cff;
}

.new-chat{
  width:100%;
  padding:12px;
  border:1px solid #333;
  border-radius:10px;
  background:#191919;
  color:#fff;
  cursor:pointer;
  text-align:left;
}

.new-chat:hover{
  background:#242424;
}

.history-title{
  color:#777;
  font-size:11px;
  margin:22px 9px 8px;
  text-transform:uppercase;
  letter-spacing:.08em;
}

.history{
  display:flex;
  flex-direction:column;
  gap:4px;
  overflow:auto;
  max-height:400px;
}

.history-item{
  width:100%;
  border:0;
  background:transparent;
  color:#ccc;
  padding:10px;
  border-radius:8px;
  cursor:pointer;
  text-align:left;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.history-item:hover{
  background:#202020;
}

.sidebar-footer{
  margin-top:auto;
  color:#666;
  font-size:11px;
  padding:10px;
}

/* MAIN */

.main{
  flex:1;
  min-width:0;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

.topbar{
  height:58px;
  border-bottom:1px solid #292929;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  background:#0d0d0d;
}

.brand{
  font-weight:700;
}

.status{
  color:#6ee7a0;
  font-size:12px;
}

/* CHAT */

.chat{
  width:min(850px,94%);
  margin:auto;
  flex:1;
  padding:35px 0 160px;
}

.welcome{
  text-align:center;
  padding:100px 15px 40px;
  color:#777;
}

.welcome h1{
  color:#fff;
  font-size:clamp(35px,6vw,52px);
  margin-bottom:12px;
}

.welcome p{
  color:#888;
}

.message{
  display:flex;
  margin:24px 0;
  line-height:1.65;
}

.message.user{
  justify-content:flex-end;
}

.bubble{
  max-width:82%;
  padding:13px 17px;
  border-radius:16px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.user .bubble{
  background:#5e52d6;
  border-bottom-right-radius:5px;
}

.assistant .bubble{
  background:#171717;
  border:1px solid #292929;
  border-bottom-left-radius:5px;
}

.label{
  font-size:11px;
  color:#8d95a3;
  margin-bottom:6px;
}

/* TYPING */

.typing{
  display:inline-flex;
  gap:4px;
  align-items:center;
}

.typing span{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#888;
  animation:blink 1s infinite;
}

.typing span:nth-child(2){
  animation-delay:.15s;
}

.typing span:nth-child(3){
  animation-delay:.3s;
}

@keyframes blink{
  0%,80%,100%{
    opacity:.25;
  }
  40%{
    opacity:1;
  }
}

/* COMPOSER */

.composer-wrap{
  position:fixed;
  left:260px;
  right:0;
  bottom:0;
  padding:15px 20px 18px;
  background:linear-gradient(
    transparent,
    #080808 30%
  );
}

.composer{
  width:min(850px,94%);
  margin:auto;
  display:flex;
  align-items:flex-end;
  gap:8px;
  padding:8px;
  background:#171717;
  border:1px solid #3a3a3a;
  border-radius:18px;
}

textarea{
  flex:1;
  min-height:48px;
  max-height:150px;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
  padding:12px;
}

textarea::placeholder{
  color:#777;
}

.clear{
  border:0;
  background:transparent;
  color:#888;
  padding:12px;
  cursor:pointer;
}

.send{
  width:46px;
  height:46px;
  border:0;
  border-radius:12px;
  background:#6d5ce7;
  color:#fff;
  cursor:pointer;
  font-size:18px;
}

.send:hover{
  background:#7b6ff0;
}

.send:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.notice{
  text-align:center;
  color:#555;
  font-size:10px;
  margin-top:7px;
}

/* MOBILE */

@media(max-width:760px){

  .sidebar{
    display:none;
  }

  .composer-wrap{
    left:0;
  }

  .chat{
    padding-top:20px;
  }

  .bubble{
    max-width:92%;
  }

  .welcome{
    padding-top:80px;
  }
}
</style>
</head>

<body>

<div class="app">

  <aside class="sidebar">

    <div class="logo">
      NEXORA <span>AI</span>
    </div>

    <button
      class="new-chat"
      id="newChatButton"
    >
      ＋ New chat
    </button>

    <div class="history-title">
      Chats
    </div>

    <div
      id="history"
      class="history"
    ></div>

    <div class="sidebar-footer">
      Nexora AI<br>
      Free Local Mode
    </div>

  </aside>


  <main class="main">

    <header class="topbar">

      <div class="brand">
        Nexora AI
      </div>

      <div
        id="status"
        class="status"
      >
        ● Ready
      </div>

    </header>


    <section
      id="chat"
      class="chat"
    >

      <div
        id="welcome"
        class="welcome"
      >

        <h1>
          Ask anything.
        </h1>

        <p>
          Chat, learn, write and solve with Nexora AI.
        </p>

      </div>

    </section>

  </main>

</div>


<div class="composer-wrap">

  <div class="composer">

    <textarea
      id="question"
      placeholder="Ask Nexora anything..."
      rows="1"
    ></textarea>

    <button
      class="clear"
      id="clearButton"
    >
      Clear
    </button>

    <button
      class="send"
      id="sendButton"
    >
      ➤
    </button>

  </div>

  <div class="notice">
    © 2026 Nexora AI · Free Local Mode
  </div>

</div>


<script type="module">

/* =====================================================
   IMPORT LOCAL ENGINE
===================================================== */

import {
  processQuestion
} from "./src/core.js";


/* =====================================================
   ELEMENTS
===================================================== */

const chat =
  document.getElementById("chat");

const questionBox =
  document.getElementById("question");

const sendButton =
  document.getElementById("sendButton");

const clearButton =
  document.getElementById("clearButton");

const newChatButton =
  document.getElementById("newChatButton");

const historyBox =
  document.getElementById("history");

const status =
  document.getElementById("status");


/* =====================================================
   STATE
===================================================== */

const HISTORY_KEY =
  "nexora_history_v6";

let messages = [];


/* =====================================================
   ADD MESSAGE
===================================================== */

function addMessage(
  text,
  role,
  skill = ""
){

  const welcome =
    document.getElementById("welcome");

  if(welcome){
    welcome.remove();
  }


  const wrapper =
    document.createElement("div");

  wrapper.className =
    "message " + role;


  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";


  if(
    role === "assistant" &&
    skill
  ){

    const label =
      document.createElement("div");

    label.className =
      "label";

    label.textContent =
      "⚡ " + skill;

    bubble.appendChild(label);

  }


  const body =
    document.createElement("div");

  body.textContent =
    String(text || "");


  bubble.appendChild(body);

  wrapper.appendChild(bubble);

  chat.appendChild(wrapper);


  requestAnimationFrame(() => {

    wrapper.scrollIntoView({
      behavior:"smooth",
      block:"end"
    });

  });

}


/* =====================================================
   TYPING INDICATOR
===================================================== */

function showTyping(){

  const wrapper =
    document.createElement("div");

  wrapper.id =
    "typingMessage";

  wrapper.className =
    "message assistant";


  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";


  const label =
    document.createElement("div");

  label.className =
    "label";

  label.textContent =
    "⚡ Nexora AI";


  const typing =
    document.createElement("div");

  typing.className =
    "typing";

  typing.innerHTML =
    "<span></span><span></span><span></span>";


  bubble.appendChild(label);
  bubble.appendChild(typing);

  wrapper.appendChild(bubble);

  chat.appendChild(wrapper);

  wrapper.scrollIntoView({
    behavior:"smooth",
    block:"end"
  });

}


function removeTyping(){

  const typing =
    document.getElementById(
      "typingMessage"
    );

  if(typing){
    typing.remove();
  }

}


/* =====================================================
   SAVE CHAT
===================================================== */

function saveChat(){

  try{

    if(!messages.length){
      return;
    }


    const chats =
      JSON.parse(
        localStorage.getItem(
          HISTORY_KEY
        ) || "[]"
      );


    const firstUser =
      messages.find(
        item =>
          item.role === "user"
      );


    if(!firstUser){
      return;
    }


    chats.push({

      title:
        firstUser.content
          .slice(0,60),

      messages:
        messages,

      time:
        Date.now()

    });


    localStorage.setItem(

      HISTORY_KEY,

      JSON.stringify(
        chats.slice(-30)
      )

    );


    renderHistory();

  }catch(error){

    console.warn(
      "History save error:",
      error
    );

  }

}


/* =====================================================
   HISTORY
===================================================== */

function renderHistory(){

  historyBox.innerHTML = "";


  try{

    const chats =
      JSON.parse(
        localStorage.getItem(
          HISTORY_KEY
        ) || "[]"
      );


    chats
      .slice()
      .reverse()
      .forEach(item => {

        const button =
          document.createElement(
            "button"
          );


        button.className =
          "history-item";


        button.textContent =
          item.title || "New chat";


        button.onclick =
          function(){

            loadChat(item);

          };


        historyBox.appendChild(
          button
        );

      });

  }catch(error){

    console.warn(
      "History render error:",
      error
    );

  }

}


/* =====================================================
   LOAD CHAT
===================================================== */

function loadChat(item){

  messages =
    Array.isArray(item.messages)
      ? item.messages
      : [];


  chat.innerHTML = "";


  messages.forEach(message => {

    addMessage(

      message.content,

      message.role,

      message.role === "assistant"
        ? "Nexora AI"
        : ""

    );

  });


  status.textContent =
    "● Ready";

}


/* =====================================================
   NEW CHAT
===================================================== */

function newChat(){

  messages = [];

  removeTyping();


  chat.innerHTML = `

    <div
      id="welcome"
      class="welcome"
    >

      <h1>
        Ask anything.
      </h1>

      <p>
        Chat, learn, write and solve with Nexora AI.
      </p>

    </div>

  `;


  questionBox.value = "";

  status.textContent =
    "● Ready";

  questionBox.focus();

}


newChatButton.addEventListener(
  "click",
  newChat
);


clearButton.addEventListener(
  "click",
  newChat
);


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage(){

  const question =
    questionBox.value.trim();


  if(!question){
    questionBox.focus();
    return;
  }


  /* USER MESSAGE */

  addMessage(
    question,
    "user"
  );


  messages.push({

    role:"user",

    content:question

  });


  questionBox.value = "";

  sendButton.disabled = true;

  status.textContent =
    "● Thinking...";


  try{

    /*
      IMPORTANT:
      Local engine is checked FIRST.
    */

    const localResult =
      processQuestion(
        question
      );


    if(
      localResult &&
      localResult.answer
    ){

      /*
        LOCAL ANSWER
        No API required.
      */

      showTyping();

      await wait(250);

      removeTyping();


      addMessage(

        localResult.answer,

        "assistant",

        localResult.skillName ||
        localResult.skill ||
        "Nexora AI"

      );


      messages.push({

        role:"assistant",

        content:
          localResult.answer

      });


      saveChat();


      status.textContent =
        "● Local Ready";


      return;

    }


    /*
      If there is no local answer,
      try backend.
    */

    showTyping();


    const backendAnswer =
      await callBackend();


    removeTyping();


    addMessage(

      backendAnswer,

      "assistant",

      "Nexora AI"

    );


    messages.push({

      role:"assistant",

      content:
        backendAnswer

    });


    saveChat();


    status.textContent =
      "● Ready";


  }catch(error){

    console.error(
      "Nexora error:",
      error
    );


    removeTyping();


    addMessage(

      "इस सवाल का local answer उपलब्ध नहीं है। " +
      "AI backend भी अभी उपलब्ध नहीं है।",

      "assistant",

      "Nexora AI"

    );


    status.textContent =
      "● Local Mode";


  }finally{

    sendButton.disabled =
      false;

    questionBox.focus();

  }

}


/* =====================================================
   BACKEND
===================================================== */

async function callBackend(){

  const response =
    await fetch(

      "/api/ask",

      {

        method:"POST",

        headers:{

          "Content-Type":
            "application/json"

        },

        body:

          JSON.stringify({

            messages:
              messages.slice(-20)

          })

      }

    );


  let data = {};

  try{

    data =
      await response.json();

  }catch{

    throw new Error(
      "Invalid backend response."
    );

  }


  if(!response.ok){

    throw new Error(

      data?.error ||
      "Backend request failed."

    );

  }


  return (

    data?.reply ||

    "AI ने कोई response नहीं दिया।"

  );

}


/* =====================================================
   WAIT
===================================================== */

function wait(ms){

  return new Promise(
    resolve =>
      setTimeout(resolve,ms)
  );

}


/* =====================================================
   ENTER KEY
===================================================== */

questionBox.addEventListener(

  "keydown",

  function(event){

    if(

      event.key === "Enter" &&
      !event.shiftKey

    ){

      event.preventDefault();

      sendMessage();

    }

  }

);


/* =====================================================
   START
===================================================== */

renderHistory();

questionBox.focus();


</script>

</body>
</html>
