<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0b0f">

<title>Nexora AI — Premium Workspace</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Inter,Arial,sans-serif;
}

:root{
  --bg:#0b0b0f;
  --panel:#111116;
  --panel2:#17171d;
  --border:#292931;
  --text:#f5f5f7;
  --muted:#9696a3;
  --accent:#8ee7ff;
  --accentText:#071015;
  --hover:#1d1d24;
}

body.light{
  --bg:#f6f7f9;
  --panel:#ffffff;
  --panel2:#f0f1f4;
  --border:#dfe1e7;
  --text:#16171b;
  --muted:#686b75;
  --hover:#e9ebef;
}

body{
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow:hidden;
}

button{
  border:0;
  cursor:pointer;
  color:inherit;
}

.app{
  display:flex;
  height:100vh;
}

/* SIDEBAR */

.sidebar{
  width:270px;
  background:var(--panel);
  border-right:1px solid var(--border);
  padding:15px;
  display:flex;
  flex-direction:column;
  transition:.25s;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 8px 20px;
}

.brand-logo{
  width:36px;
  height:36px;
  border-radius:12px;
  display:grid;
  place-items:center;
  background:var(--accent);
  color:var(--accentText);
  font-weight:900;
}

.brand-name{
  font-size:20px;
  font-weight:800;
}

.new-chat{
  width:100%;
  background:var(--panel2);
  border:1px solid var(--border);
  padding:12px;
  border-radius:12px;
  text-align:left;
  margin-bottom:18px;
}

.new-chat:hover{
  background:var(--hover);
}

.sidebar-title{
  color:var(--muted);
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1px;
  margin:10px 8px;
}

.history{
  overflow:auto;
  flex:1;
}

.history-item{
  padding:10px;
  border-radius:9px;
  color:var(--muted);
  font-size:13px;
  margin-bottom:4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.history-item:hover{
  background:var(--hover);
  color:var(--text);
}

.sidebar-bottom{
  border-top:1px solid var(--border);
  padding-top:12px;
}

.side-btn{
  width:100%;
  background:transparent;
  padding:11px;
  border-radius:9px;
  text-align:left;
  color:var(--muted);
}

.side-btn:hover{
  background:var(--hover);
  color:var(--text);
}

/* MAIN */

.main{
  flex:1;
  display:flex;
  flex-direction:column;
  min-width:0;
}

.topbar{
  height:62px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  background:var(--bg);
}

.model{
  font-weight:700;
}

.model small{
  color:var(--muted);
  font-weight:400;
  margin-left:6px;
}

.top-actions{
  display:flex;
  gap:8px;
}

.icon-btn{
  width:38px;
  height:38px;
  border-radius:10px;
  background:transparent;
  font-size:17px;
}

.icon-btn:hover{
  background:var(--hover);
}

/* CHAT */

.chat{
  flex:1;
  overflow:auto;
  padding:25px 18px 170px;
}

.chat-inner{
  width:min(820px,100%);
  margin:auto;
}

.welcome{
  min-height:60vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.welcome-logo{
  width:64px;
  height:64px;
  border-radius:20px;
  display:grid;
  place-items:center;
  background:var(--accent);
  color:var(--accentText);
  font-size:28px;
  font-weight:900;
  margin-bottom:20px;
}

.welcome h1{
  font-size:clamp(28px,5vw,42px);
  margin-bottom:10px;
}

.welcome p{
  color:var(--muted);
  max-width:600px;
  line-height:1.6;
}

.suggestions{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  width:min(650px,100%);
  margin-top:28px;
}

.suggestion{
  background:var(--panel);
  border:1px solid var(--border);
  padding:14px;
  border-radius:13px;
  text-align:left;
}

.suggestion:hover{
  border-color:var(--accent);
}

.message{
  display:flex;
  gap:12px;
  margin:25px 0;
}

.message.user{
  justify-content:flex-end;
}

.avatar{
  width:32px;
  height:32px;
  min-width:32px;
  border-radius:10px;
  display:grid;
  place-items:center;
  background:var(--panel2);
  border:1px solid var(--border);
  font-size:13px;
}

.message.user .avatar{
  order:2;
}

.bubble{
  max-width:min(720px,85%);
  line-height:1.7;
  white-space:pre-wrap;
}

.message.user .bubble{
  background:var(--panel2);
  border:1px solid var(--border);
  padding:12px 15px;
  border-radius:16px;
}

/* COMPOSER */

.composer-wrap{
  position:fixed;
  bottom:0;
  left:270px;
  right:0;
  padding:18px 20px 22px;
  background:linear-gradient(
    transparent,
    var(--bg) 28%
  );
}

.composer{
  width:min(820px,100%);
  margin:auto;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:18px;
  padding:10px;
  box-shadow:0 10px 35px rgba(0,0,0,.18);
}

textarea{
  width:100%;
  min-height:54px;
  max-height:180px;
  resize:none;
  background:transparent;
  border:0;
  outline:0;
  color:var(--text);
  padding:10px;
  font-size:15px;
}

textarea::placeholder{
  color:var(--muted);
}

.composer-actions{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:4px;
}

.left-actions,
.right-actions{
  display:flex;
  gap:6px;
}

.small-btn{
  background:transparent;
  border:1px solid transparent;
  padding:8px 10px;
  border-radius:9px;
  color:var(--muted);
}

.small-btn:hover{
  background:var(--hover);
  color:var(--text);
}

.send{
  width:38px;
  height:38px;
  border-radius:11px;
  background:var(--accent);
  color:var(--accentText);
  font-weight:900;
}

/* TOOLS */

.tools-panel{
  position:fixed;
  top:70px;
  right:20px;
  width:300px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:16px;
  padding:10px;
  display:none;
  z-index:50;
  box-shadow:0 20px 50px rgba(0,0,0,.3);
}

.tools-panel.show{
  display:block;
}

.tool{
  width:100%;
  padding:13px;
  background:transparent;
  border-radius:10px;
  text-align:left;
  display:flex;
  gap:12px;
  align-items:center;
}

.tool:hover{
  background:var(--hover);
}

.tool-icon{
  font-size:20px;
}

.tool-text strong{
  display:block;
  margin-bottom:3px;
}

.tool-text span{
  color:var(--muted);
  font-size:11px;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:100;
  padding:20px;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(600px,100%);
  max-height:85vh;
  overflow:auto;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:20px;
  padding:20px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.close{
  background:var(--panel2);
  width:35px;
  height:35px;
  border-radius:9px;
}

.field{
  width:100%;
  background:var(--bg);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:11px;
  padding:12px;
  margin-bottom:12px;
  outline:none;
}

.primary{
  background:var(--accent);
  color:var(--accentText);
  padding:11px 17px;
  border-radius:10px;
  font-weight:700;
}

.output{
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:12px;
  padding:14px;
  white-space:pre-wrap;
  line-height:1.6;
  margin-top:12px;
  display:none;
}

/* MOBILE */

.mobile-menu{
  display:none;
}

@media(max-width:750px){

  body{
    overflow:hidden;
  }

  .sidebar{
    position:fixed;
    left:-280px;
    top:0;
    bottom:0;
    z-index:80;
  }

  .sidebar.open{
    left:0;
  }

  .mobile-menu{
    display:block;
  }

  .composer-wrap{
    left:0;
    padding:12px;
  }

  .suggestions{
    grid-template-columns:1fr;
  }

  .tools-panel{
    right:10px;
    left:10px;
    width:auto;
  }

  .bubble{
    max-width:90%;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->

  <aside class="sidebar" id="sidebar">

    <div class="brand">
      <div class="brand-logo">N</div>
      <div class="brand-name">Nexora AI</div>
    </div>

    <button
      class="new-chat"
      id="newChat"
    >
      ＋ New chat
    </button>

    <div class="sidebar-title">
      Recent
    </div>

    <div
      class="history"
      id="history"
    ></div>

    <div class="sidebar-bottom">

      <button
        class="side-btn"
        id="themeBtn"
      >
        🌙 Appearance
      </button>

      <button
        class="side-btn"
        id="clearHistory"
      >
        🗑️ Clear history
      </button>

    </div>

  </aside>


  <!-- MAIN -->

  <main class="main">

    <header class="topbar">

      <button
        class="icon-btn mobile-menu"
        id="mobileMenu"
      >
        ☰
      </button>

      <div class="model">
        Nexora
        <small>Premium Workspace</small>
      </div>

      <div class="top-actions">

        <button
          class="icon-btn"
          id="toolsBtn"
          title="Tools"
        >
          🔎
        </button>

      </div>

    </header>


    <!-- TOOLS -->

    <div
      class="tools-panel"
      id="toolsPanel"
    >

      <button
        class="tool"
        data-tool="writer"
      >
        <div class="tool-icon">✍️</div>
        <div class="tool-text">
          <strong>AI Writer</strong>
          <span>Write captions and text</span>
        </div>
      </button>

      <button
        class="tool"
        data-tool="ideas"
      >
        <div class="tool-icon">💡</div>
        <div class="tool-text">
          <strong>Idea Generator</strong>
          <span>Create new ideas</span>
        </div>
      </button>

      <button
        class="tool"
        data-tool="study"
      >
        <div class="tool-icon">📚</div>
        <div class="tool-text">
          <strong>Study Helper</strong>
          <span>Explain topics simply</span>
        </div>
      </button>

      <button
        class="tool"
        data-tool="calculator"
      >
        <div class="tool-icon">🧮</div>
        <div class="tool-text">
          <strong>Calculator</strong>
          <span>Calculate expressions</span>
        </div>
      </button>

      <button
        class="tool"
        data-tool="image"
      >
        <div class="tool-icon">🖼️</div>
        <div class="tool-text">
          <strong>Image Studio</strong>
          <span>Upload and preview images</span>
        </div>
      </button>

      <button
        class="tool"
        data-tool="pdf"
      >
        <div class="tool-icon">📄</div>
        <div class="tool-text">
          <strong>PDF Tool</strong>
          <span>Work with PDF files</span>
        </div>
      </button>

    </div>


    <!-- CHAT -->

    <section
      class="chat"
      id="chat"
    >

      <div
        class="chat-inner"
        id="chatInner"
      >

        <div
          class="welcome"
          id="welcome"
        >

          <div class="welcome-logo">
            N
          </div>

          <h1>
            What can Nexora help with?
          </h1>

          <p>
            Ask a question, solve a problem,
            write something, generate ideas,
            or open one of the tools.
          </p>


          <div class="suggestions">

            <button
              class="suggestion"
              data-prompt="भारत की राजधानी क्या है?"
            >
              🇮🇳 भारत की राजधानी क्या है?
            </button>

            <button
              class="suggestion"
              data-prompt="2+2"
            >
              🧮 Calculate 2 + 2
            </button>

            <button
              class="suggestion"
              data-prompt="Explain photosynthesis simply"
            >
              📚 Explain photosynthesis
            </button>

            <button
              class="suggestion"
              data-prompt="Give me three creative project ideas"
            >
              💡 Give me project ideas
            </button>

          </div>

        </div>

      </div>

    </section>


    <!-- COMPOSER -->

    <div class="composer-wrap">

      <div class="composer">

        <textarea
          id="input"
          placeholder="Ask Nexora anything..."
        ></textarea>


        <div class="composer-actions">

          <div class="left-actions">

            <button
              class="small-btn"
              id="attachBtn"
            >
              ＋
            </button>

            <button
              class="small-btn"
              id="toolsTextBtn"
            >
              🔎 Tools
            </button>

          </div>


          <div class="right-actions">

            <button
              class="send"
              id="send"
              title="Send"
            >
              ➤
            </button>

          </div>

        </div>

      </div>

    </div>

  </main>

</div>


<!-- TOOL MODAL -->

<div
  class="modal"
  id="modal"
>

  <div class="modal-box">

    <div class="modal-head">

      <h2 id="modalTitle">
        Tool
      </h2>

      <button
        class="close"
        id="closeModal"
      >
        ✕
      </button>

    </div>

    <div id="modalContent"></div>

  </div>

</div>


<script>
(function(){

"use strict";


const input =
  document.getElementById("input");

const send =
  document.getElementById("send");

const chatInner =
  document.getElementById("chatInner");

const welcome =
  document.getElementById("welcome");

const history =
  document.getElementById("history");

const modal =
  document.getElementById("modal");

const modalTitle =
  document.getElementById("modalTitle");

const modalContent =
  document.getElementById("modalContent");


/* CHAT */

function addMessage(type,text){

  if(welcome){
    welcome.style.display="none";
  }

  const row =
    document.createElement("div");

  row.className =
    "message " + type;


  const avatar =
    document.createElement("div");

  avatar.className="avatar";

  avatar.textContent =
    type==="user" ? "You" : "N";


  const bubble =
    document.createElement("div");

  bubble.className="bubble";

  bubble.textContent=text;


  row.appendChild(avatar);
  row.appendChild(bubble);

  chatInner.appendChild(row);

  document
    .getElementById("chat")
    .scrollTop =
    document
      .getElementById("chat")
      .scrollHeight;

}


function calculate(text){

  const cleaned =
    text
      .toLowerCase()
      .replace(/what is/g,"")
      .replace(/calculate/g,"")
      .replace(/=/g,"")
      .trim();


  if(
    !/^[0-9+\-*/().\s]+$/.test(cleaned)
  ){
    return null;
  }

  if(!/[+\-*/]/.test(cleaned)){
    return null;
  }


  try{

    const result =
      Function(
        '"use strict";return('+
        cleaned+
        ')'
      )();


    if(
      typeof result==="number" &&
      Number.isFinite(result)
    ){
      return cleaned+" = "+result;
    }

  }catch(e){}

  return null;
}


function answer(text){

  const lower =
    text.toLowerCase();


  const math =
    calculate(text);

  if(math){
    return math;
  }


  if(
    lower.includes("bharat ki rajdhani") ||
    lower.includes("भारत की राजधानी") ||
    lower.includes("capital of india")
  ){

    return(
`भारत की राजधानी नई दिल्ली है।

नई दिल्ली भारत का प्रमुख प्रशासनिक और राजनीतिक केंद्र है। यहां भारतीय संसद, राष्ट्रपति भवन और कई महत्वपूर्ण सरकारी संस्थान स्थित हैं।

अगर तुम चाहो तो Nexora आगे भारत के इतिहास, भूगोल और सामान्य ज्ञान से जुड़े सवाल भी समझा सकता है।`
    );

  }


  if(
    lower==="hi" ||
    lower==="hello" ||
    lower.includes("namaste")
  ){

    return(
`नमस्ते! 👋

मैं Nexora AI हूँ। तुम मुझसे सवाल पूछ सकते हो, calculation कर सकते हो और Tools से Writer, Study, Ideas, Image और PDF features इस्तेमाल कर सकते हो।`
    );

  }


  if(
    lower.includes("who are you") ||
    lower.includes("tum kaun ho")
  ){

    return(
`मैं Nexora AI हूँ — एक premium AI workspace design, जिसमें chat और कई productivity tools एक ही interface में रखे गए हैं।`
    );

  }


  return(
`मैंने आपका सवाल समझ लिया:

"${text}"

अभी Nexora का premium frontend तैयार है। Real AI model connection अगला step है।`
  );

}


function sendMessage(){

  const text =
    input.value.trim();

  if(!text){
    input.focus();
    return;
  }


  addMessage(
    "user",
    text
  );

  input.value="";


  setTimeout(function(){

    addMessage(
      "assistant",
      answer(text)
    );

  },350);


  addHistory(text);

}


send.addEventListener(
  "click",
  sendMessage
);


input.addEventListener(
  "keydown",
  function(e){

    if(
      e.key==="Enter" &&
      !e.shiftKey
    ){

      e.preventDefault();
      sendMessage();

    }

  }
);


/* SUGGESTIONS */

document
  .querySelectorAll("[data-prompt]")
  .forEach(function(button){

    button.addEventListener(
      "click",
      function(){

        input.value =
          button.dataset.prompt;

        input.focus();

      }
    );

  });


/* HISTORY */

function addHistory(text){

  const item =
    document.createElement("div");

  item.className =
    "history-item";

  item.textContent =
    text;

  item.title =
    text;


  item.addEventListener(
    "click",
    function(){

      input.value=text;
      input.focus();

    }
  );


  history.prepend(item);

}


document
  .getElementById("newChat")
  .addEventListener(
    "click",
    function(){

      chatInner.innerHTML="";

      const newWelcome =
        document.createElement("div");

      newWelcome.className="welcome";

      newWelcome.innerHTML=`
        <div class="welcome-logo">N</div>
        <h1>What can Nexora help with?</h1>
        <p>Start a new conversation.</p>
      `;

      chatInner.appendChild(
        newWelcome
      );

      input.focus();

    }
  );


document
  .getElementById("clearHistory")
  .addEventListener(
    "click",
    function(){

      history.innerHTML="";

    }
  );


/* THEME */

document
  .getElementById("themeBtn")
  .addEventListener(
    "click",
    function(){

      document.body.classList.toggle(
        "light"
      );

    }
  );


/* TOOLS */

const toolsPanel =
  document.getElementById(
    "toolsPanel"
  );


function toggleTools(){

  toolsPanel.classList.toggle(
    "show"
  );

}


document
  .getElementById("toolsBtn")
  .addEventListener(
    "click",
    toggleTools
  );


document
  .getElementById("toolsTextBtn")
  .addEventListener(
    "click",
    toggleTools
  );


/* MODAL */

function openModal(title,html){

  modalTitle.textContent=title;

  modalContent.innerHTML=html;

  modal.classList.add("show");

}


function closeModal(){

  modal.classList.remove(
    "show"
  );

}


document
  .getElementById("closeModal")
  .addEventListener(
    "click",
    closeModal
  );


modal.addEventListener(
  "click",
  function(e){

    if(e.target===modal){
      closeModal();
    }

  }
);


/* TOOL ACTIONS */

document
  .querySelectorAll("[data-tool]")
  .forEach(function(button){

    button.addEventListener(
      "click",
      function(){

        toolsPanel.classList.remove(
          "show"
        );


        const tool =
          button.dataset.tool;


        if(tool==="writer"){

          openModal(
            "✍️ AI Writer",
            `
            <input
              class="field"
              id="writerTopic"
              placeholder="What should Nexora write about?"
            >

            <select
              class="field"
              id="writerType"
            >
              <option value="caption">Social Caption</option>
              <option value="description">Description</option>
              <option value="paragraph">Paragraph</option>
              <option value="idea">Creative Idea</option>
            </select>

            <button
              class="primary"
              id="writerGenerate"
            >
              Generate
            </button>
