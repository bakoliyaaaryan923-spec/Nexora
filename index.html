<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nexora AI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Inter,sans-serif;
  background:#080808;
  color:#fff;
  min-height:100vh;
}

button,
textarea{
  font:inherit;
}

.app{
  display:flex;
  min-height:100vh;
}

/* SIDEBAR */

.sidebar{
  width:260px;
  background:#111;
  border-right:1px solid #292929;
  padding:14px;
  display:flex;
  flex-direction:column;
}

.logo{
  font-size:21px;
  font-weight:800;
  padding:12px 10px 18px;
}

.logo span{
  color:#8b7cff;
}

.new-chat{
  width:100%;
  padding:12px;
  border:1px solid #333;
  border-radius:10px;
  background:#191919;
  color:white;
  cursor:pointer;
  text-align:left;
}

.new-chat:hover{
  background:#242424;
}

.history-title{
  color:#777;
  font-size:11px;
  margin:22px 9px 8px;
  text-transform:uppercase;
}

.history{
  display:flex;
  flex-direction:column;
  gap:3px;
  overflow:auto;
}

.history-item{
  border:0;
  background:transparent;
  color:#ccc;
  padding:10px;
  border-radius:8px;
  cursor:pointer;
  text-align:left;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.history-item:hover{
  background:#202020;
}

.sidebar-footer{
  margin-top:auto;
  color:#666;
  font-size:11px;
  padding:10px;
}

/* MAIN */

.main{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  min-height:100vh;
}

.topbar{
  height:58px;
  border-bottom:1px solid #292929;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  background:#0d0d0d;
}

.status{
  color:#6ee7a0;
  font-size:12px;
}

/* CHAT */

.chat{
  flex:1;
  width:min(850px,94%);
  margin:auto;
  padding:35px 0 150px;
}

.welcome{
  text-align:center;
  padding:100px 15px 40px;
  color:#777;
}

.welcome h1{
  color:white;
  font-size:42px;
  margin-bottom:10px;
}

.welcome p{
  color:#888;
}

.message{
  display:flex;
  margin:24px 0;
  line-height:1.65;
}

.message.user{
  justify-content:flex-end;
}

.bubble{
  max-width:80%;
  padding:13px 17px;
  border-radius:16px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.user .bubble{
  background:#2f2f2f;
}

.assistant .bubble{
  background:transparent;
}

.label{
  font-size:11px;
  color:#888;
  margin-bottom:5px;
}

/* COMPOSER */

.composer-wrap{
  position:fixed;
  left:260px;
  right:0;
  bottom:0;
  padding:15px 20px 18px;
  background:linear-gradient(
    transparent,
    #080808 28%
  );
}

.composer{
  width:min(850px,94%);
  margin:auto;
  display:flex;
  align-items:flex-end;
  gap:8px;
  padding:8px;
  background:#171717;
  border:1px solid #3a3a3a;
  border-radius:18px;
}

textarea{
  flex:1;
  min-height:48px;
  max-height:150px;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:white;
  padding:12px;
}

textarea::placeholder{
  color:#777;
}

.clear{
  border:0;
  background:transparent;
  color:#888;
  padding:12px;
  cursor:pointer;
}

.send{
  width:46px;
  height:46px;
  border:0;
  border-radius:12px;
  background:#6d5ce7;
  color:white;
  cursor:pointer;
  font-size:18px;
}

.send:disabled{
  opacity:.5;
}

.notice{
  text-align:center;
  color:#555;
  font-size:10px;
  margin-top:7px;
}

/* MOBILE */

@media(max-width:760px){

  .sidebar{
    display:none;
  }

  .composer-wrap{
    left:0;
  }

  .chat{
    padding-top:20px;
  }

  .bubble{
    max-width:90%;
  }

  .welcome h1{
    font-size:34px;
  }
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar">

  <div class="logo">
    NEXORA <span>AI</span>
  </div>

  <button
    class="new-chat"
    onclick="newChat()"
  >
    ＋ New chat
  </button>

  <div class="history-title">
    Chats
  </div>

  <div
    id="history"
    class="history"
  ></div>

  <div class="sidebar-footer">
    Nexora AI v5<br>
    Local + Secure AI Backend
  </div>

</aside>


<main class="main">

<header class="topbar">

  <strong>Nexora AI</strong>

  <div
    id="status"
    class="status"
  >
    ● Ready
  </div>

</header>


<div
  id="chat"
  class="chat"
>

  <div
    id="welcome"
    class="welcome"
  >

    <h1>
      Ask anything.
    </h1>

    <p>
      Chat, learn, write and solve with Nexora AI.
    </p>

  </div>

</div>

</main>

</div>


<div class="composer-wrap">

<div class="composer">

<textarea
  id="question"
  placeholder="Ask Nexora anything..."
  rows="1"
></textarea>

<button
  class="clear"
  onclick="newChat()"
>
  Clear
</button>

<button
  id="sendButton"
  class="send"
  onclick="sendMessage()"
>
  ➤
</button>

</div>

<div class="notice">
  © 2026 Nexora AI
</div>

</div>


<script type="module">

import {
  processQuestion
} from "./src/core.js";


const chat =
  document.getElementById("chat");

const questionBox =
  document.getElementById("question");

const historyBox =
  document.getElementById("history");

const sendButton =
  document.getElementById("sendButton");

const status =
  document.getElementById("status");


const HISTORY_KEY =
  "nexora_chats_v5";


let messages = [];


/* =========================
   ADD MESSAGE
========================= */

function addMessage(
  text,
  role,
  label
){

  const welcome =
    document.getElementById("welcome");

  if(welcome){
    welcome.remove();
  }

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "message " + role;

  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";

  if(label){

    const labelDiv =
      document.createElement("div");

    labelDiv.className =
      "label";

    labelDiv.textContent =
      label;

    bubble.appendChild(
      labelDiv
    );
  }

  const content =
    document.createElement("div");

  content.textContent =
    text;

  bubble.appendChild(
    content
  );

  wrapper.appendChild(
    bubble
  );

  chat.appendChild(
    wrapper
  );

  wrapper.scrollIntoView({
    behavior:"smooth",
    block:"end"
  });
}


/* =========================
   SAVE HISTORY
========================= */

function saveHistory(){

  try{

    const chats =
      JSON.parse(
        localStorage.getItem(
          HISTORY_KEY
        ) || "[]"
      );

    const firstUser =
      messages.find(
        m => m.role === "user"
      );

    if(!firstUser){
      return;
    }

    chats.push({
      title:
        firstUser.content.slice(0,60),

      messages,

      time:
        Date.now()
    });

    localStorage.setItem(
      HISTORY_KEY,
      JSON.stringify(
        chats.slice(-30)
      )
    );

    renderHistory();

  }catch(error){

    console.warn(
      "History error:",
      error
    );

  }
}


/* =========================
   HISTORY UI
========================= */

function renderHistory(){

  historyBox.innerHTML = "";

  try{

    const chats =
      JSON.parse(
        localStorage.getItem(
          HISTORY_KEY
        ) || "[]"
      );

    chats
      .slice()
      .reverse()
      .forEach(item => {

        const button =
          document.createElement("button");

        button.className =
          "history-item";

        button.textContent =
          item.title;

        button.onclick =
          () => loadChat(item);

        historyBox.appendChild(
          button
        );

      });

  }catch(error){

    console.warn(
      "History render error:",
      error
    );

  }
}


/* =========================
   LOAD CHAT
========================= */

function loadChat(item){

  messages =
    Array.isArray(item.messages)
      ? item.messages
      : [];

  chat.innerHTML = "";

  messages.forEach(message => {

    addMessage(
      message.content,
      message.role,
      message.role === "assistant"
        ? "Nexora AI"
        : ""
    );

  });

  status.textContent =
    "● Ready";
}


/* =========================
   NEW CHAT
========================= */

window.newChat =
function(){

  messages = [];

  chat.innerHTML = `

    <div
      id="welcome"
      class="welcome"
    >

      <h1>
        Ask anything.
      </h1>

      <p>
        Chat, learn, write and solve with Nexora AI.
      </p>

    </div>

  `;

  questionBox.value = "";

  status.textContent =
    "● Ready";

  questionBox.focus();
};


/* =========================
   BACKEND
========================= */

async function callBackend(){

  const response =
    await fetch(
      "/api/ask",
      {
        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:JSON.stringify({
          messages
        })
      }
    );


  const data =
    await response.json();


  if(!response.ok){

    throw new Error(
      data?.error ||
      "Backend request failed."
    );

  }


  return (
    data?.reply ||
    "No response received."
  );
}


/* =========================
   SEND
========================= */

window.sendMessage =
async function(){

  const question =
    questionBox.value.trim();


  if(!question){
    return;
  }


  addMessage(
    question,
    "user"
  );


  messages.push({
    role:"user",
    content:question
  });


  questionBox.value = "";

  sendButton.disabled = true;

  status.textContent =
    "● Thinking...";


  try{

    const local =
      processQuestion(
        question
      );


    if(
      local?.local &&
      local?.answer
    ){

      addMessage(
        local.answer,
        "assistant",
        local.skillName
      );

      messages.push({
        role:"assistant",
        content:local.answer
      });

    }else{

      const answer =
        await callBackend();


      addMessage(
        answer,
        "assistant",
        "Nexora AI"
      );


      messages.push({
        role:"assistant",
        content:answer
      });

    }


    saveHistory();


    status.textContent =
      "● Ready";

  }catch(error){

    console.error(error);


    const message =
      "AI backend से connection नहीं हो पाया। " +
      "Vercel deployment और API configuration check करें।";


    addMessage(
      message,
      "assistant",
      "System"
    );


    status.textContent =
      "● Error";

  }finally{

    sendButton.disabled = false;

  }

};


/* =========================
   ENTER
========================= */

questionBox.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =========================
   START
========================= */

renderHistory();

</script>

</body>
</html>
